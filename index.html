<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench - build a robot, then drive it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#0D131B; --panel:#141C26; --edge:rgba(232,238,244,.12); --edge2:rgba(232,238,244,.22);
  --text:#E8EEF4; --dim:#93A2B4; --hazard:#FFC400; --good:#5BE49B; --bad:#FF6B70;
  --paper:#E7ECF1; --blue:#9DB2C7; --ink:#141C26;
  --ui:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --slate:#0D131B; --text:#E8EEF4; } }
:root[data-theme="dark"]{ --slate:#0D131B; --text:#E8EEF4; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; }
body{ background:var(--slate); color:var(--text); font-family:var(--ui); overflow:hidden;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--hazard); outline-offset:2px; }

#app{ position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto; }

header{ display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--edge); flex-wrap:wrap; }
.mark{ font-weight:700; font-size:17px; letter-spacing:.02em; }
.mark span{ color:var(--hazard); }
.tagline{ color:var(--dim); font-size:13px; }
.grow{ flex:1; }
.tabs{ display:flex; background:rgba(255,255,255,.05); border:1px solid var(--edge); border-radius:999px; padding:2px; }
.tabs button{ border:0; background:none; border-radius:999px; padding:6px 16px; font-size:14px; font-weight:600; color:var(--dim); }
.tabs button[aria-selected="true"]{ background:var(--hazard); color:#1A1400; }
select{ background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:7px 10px; font-size:14px; }

main{ position:relative; display:grid; grid-template-columns:270px 1fr; min-height:0; }
#side{ border-right:1px solid var(--edge); overflow-y:auto; padding:14px; display:grid; gap:14px; align-content:start; background:var(--panel); }
#stage{ position:relative; min-width:0; min-height:0; }
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

h2{ font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim); margin:0 0 8px; font-weight:600; }
.palette{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.pbtn{ display:grid; gap:2px; justify-items:start; text-align:left; background:rgba(255,255,255,.05); border:1px solid var(--edge);
  border-radius:9px; padding:8px 9px; }
.pbtn:hover{ background:rgba(255,255,255,.1); }
.pbtn b{ font-size:13px; font-weight:600; }
.pbtn small{ font-size:11px; color:var(--dim); line-height:1.3; }
.props{ display:grid; gap:8px; }
.row{ display:flex; align-items:center; gap:8px; }
.row label{ font-size:13px; color:var(--dim); min-width:58px; }
input[type=range]{ flex:1; accent-color:var(--hazard); min-width:0; }
.val{ font-size:13px; font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }
.btn{ border:1px solid var(--edge); background:rgba(255,255,255,.06); border-radius:8px; padding:7px 11px; font-size:13px; font-weight:500; }
.btn:hover{ background:rgba(255,255,255,.12); }
.btn.primary{ background:var(--hazard); border-color:var(--hazard); color:#1A1400; font-weight:600; }
.btn.danger{ color:var(--bad); }
.btn[disabled]{ opacity:.45; cursor:default; }
.chip{ font-size:12px; color:var(--dim); }
.note{ font-size:12.5px; color:var(--dim); line-height:1.45; }
.coach{ font-size:13px; color:var(--text); background:rgba(255,196,0,.09); border:1px solid rgba(255,196,0,.28);
  border-radius:9px; padding:9px 11px; line-height:1.45; }
.chips{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.chip2{ display:flex; align-items:center; gap:8px; border:1px solid var(--edge); background:rgba(255,255,255,.05);
  border-radius:10px; padding:9px 10px; font-size:13.5px; font-weight:500; text-align:left; }
.chip2:hover{ background:rgba(255,255,255,.1); }
.chip2[aria-checked="true"]{ border-color:var(--hazard); background:rgba(255,196,0,.14); }
.chip2 i{ font-style:normal; font-size:15px; width:18px; text-align:center; }
.chips3{ display:flex; gap:6px; }
.chips3 .chip2{ flex:1; justify-content:center; padding:8px 6px; }
.pgrid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.pbtn2{ display:grid; justify-items:center; gap:2px; border:1px solid var(--edge); background:rgba(255,255,255,.05);
  border-radius:10px; padding:9px 4px 7px; font-size:11.5px; color:var(--dim); }
.pbtn2:hover{ background:rgba(255,255,255,.11); color:var(--text); }
.pbtn2 i{ font-style:normal; font-size:17px; color:var(--text); }
.btn.big{ padding:9px 22px; font-size:15px; }
.card{ border:1px solid var(--edge); border-radius:11px; padding:10px 11px; display:grid; gap:8px; background:rgba(255,255,255,.04); }
.card h3{ margin:0; font-size:13.5px; }

footer{ border-top:1px solid var(--edge); padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--panel); }
.seg{ display:flex; background:rgba(255,255,255,.05); border:1px solid var(--edge); border-radius:999px; padding:2px; }
.seg button{ border:0; background:none; border-radius:999px; padding:5px 12px; font-size:13px; color:var(--dim); font-weight:500; }
.seg button[aria-checked="true"]{ background:rgba(255,255,255,.14); color:var(--text); }
.status{ font-size:13px; color:var(--dim); }
.status b{ color:var(--text); font-variant-numeric:tabular-nums; }
.status.win b{ color:var(--good); }
.status.fail b{ color:var(--bad); }

.rules{ display:grid; gap:6px; }
.rule{ display:flex; gap:4px; align-items:center; }
.rule select{ flex:1; min-width:0; padding:5px 6px; font-size:12.5px; }
.rule .x{ border:0; background:none; color:var(--dim); padding:2px 4px; font-size:15px; }

#live{ position:absolute; left:12px; top:12px; width:250px; background:rgba(14,20,28,.93);
  border:1px solid var(--edge2); border-radius:11px; padding:10px 12px; backdrop-filter:blur(8px); }
#live[hidden]{ display:none; }
#live h3{ margin:0 0 7px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
#live table{ width:100%; border-collapse:collapse; font-size:12px; }
#live td{ padding:2px 0; vertical-align:middle; }
#live td:first-child{ color:var(--dim); white-space:nowrap; padding-right:7px; }
#live td:last-child{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
#live tr.sub td{ color:rgba(147,162,180,.65); font-size:11px; }
#live tr.warn td{ color:var(--bad); font-weight:600; }
.bar{ display:block; width:66px; height:6px; border-radius:3px; background:rgba(255,255,255,.1); overflow:hidden; }
.bar span{ display:block; height:100%; border-radius:3px; }
#report{ position:absolute; right:12px; bottom:12px; width:min(330px, calc(100% - 24px)); background:rgba(16,22,32,.94);
  border:1px solid var(--edge2); border-radius:12px; padding:13px 15px; backdrop-filter:blur(10px); }
#report[hidden]{ display:none; }
#report h3{ margin:0 0 4px; font-size:15px; }
#report h3.win{ color:var(--good); } #report h3.fail{ color:var(--bad); }
#report ul{ margin:8px 0 0; padding-left:17px; }
#report li{ font-size:13px; color:var(--dim); line-height:1.5; margin-bottom:5px; }
#report li b{ color:var(--text); font-weight:600; }
#report .close{ position:absolute; top:8px; right:10px; border:0; background:none; color:var(--dim); font-size:16px; }


.slot{ display:grid; grid-template-columns:1fr auto auto; gap:6px; align-items:center; font-size:13px; }
.slot b{ display:block; font-weight:600; }
.slot small{ display:block; color:var(--dim); font-size:11.5px; }
#sheet,#lessons,#records,#class{ position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:16px; background:rgba(8,12,18,.66); }
#sheet[hidden],#lessons[hidden],#records[hidden],#class[hidden]{ display:none; }
.shbox{ width:min(540px,100%); max-height:100%; overflow:auto; background:var(--panel); border:1px solid var(--edge2);
  border-radius:14px; padding:16px; display:grid; gap:10px; }
.shbox h3{ margin:0; font-size:16px; }
.shbox textarea{ width:100%; min-height:150px; resize:vertical; background:var(--slate); color:var(--text);
  border:1px solid var(--edge); border-radius:8px; padding:8px; font:12px/1.45 ui-monospace,Menlo,Consolas,monospace; }
.btnrow{ display:flex; gap:8px; flex-wrap:wrap; }
.lcard{ display:grid; grid-template-columns:1fr auto; gap:3px 12px; align-items:center; border:1px solid var(--edge);
  border-radius:11px; padding:10px 12px; background:rgba(255,255,255,.04); }
.lcard b{ font-size:14px; }
.lcard small{ color:var(--dim); font-size:12.5px; line-height:1.4; grid-column:1; }
.lcard .btn{ grid-column:2; grid-row:1 / span 2; }
.badge{ font-size:11px; font-weight:500; color:var(--good); border:1px solid rgba(91,228,155,.4); border-radius:999px; padding:1px 8px; margin-left:8px; }
.badge.cur{ color:var(--hazard); border-color:rgba(255,196,0,.45); }
#toast{ position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:30; max-width:calc(100% - 32px);
  background:rgba(16,22,32,.97); border:1px solid var(--edge2); border-radius:999px; padding:8px 16px; font-size:13px; }
#toast[hidden]{ display:none; }
.lesson{ display:grid; gap:8px; }
.lesson h3{ margin:0; font-size:14px; }
.chk{ display:flex; gap:8px; font-size:12.5px; color:var(--dim); line-height:1.4; }
.chk i{ font-style:normal; font-weight:700; width:12px; text-align:center; }
.chk.ok{ color:var(--good); }
.lrow{ display:flex; gap:6px; flex-wrap:wrap; }
.lrow .btn{ padding:5px 9px; font-size:12.5px; }


#graphs{ position:absolute; right:12px; top:12px; width:min(400px,calc(100% - 298px)); min-width:230px; background:rgba(14,20,28,.93);
  border:1px solid var(--edge2); border-radius:11px; padding:8px 10px 4px; backdrop-filter:blur(8px); }
#graphs[hidden]{ display:none; }
.wide{ width:min(700px,100%); }
.stack{ display:grid; gap:10px; }
.stack[hidden]{ display:none; }
.fld{ display:grid; gap:4px; min-width:0; }
.fld label{ font-size:12px; color:var(--dim); }
.fld input,.fld select,.fld textarea,.txt{ width:100%; background:var(--slate); color:var(--text); border:1px solid var(--edge); border-radius:8px; padding:7px 8px; font:inherit; font-size:13px; min-width:0; }
.fld textarea{ min-height:64px; resize:vertical; }
.txt{ margin-top:2px; }
.pk{ display:flex; align-items:center; gap:6px; font-size:13px; }
.pk input[type=number]{ width:54px; background:var(--slate); color:var(--text); border:1px solid var(--edge); border-radius:6px; padding:3px 5px; font:inherit; font-size:12.5px; }
.pkgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:6px 12px; }
.trow{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.tblwrap{ overflow-x:auto; }
.rtbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
.rtbl th{ text-align:left; color:var(--dim); font-weight:500; padding:4px 6px; border-bottom:1px solid var(--edge); }
.rtbl td{ padding:5px 6px; border-bottom:1px solid var(--edge); vertical-align:top; font-variant-numeric:tabular-nums; }
.rtbl td small{ display:block; color:var(--dim); font-size:11.5px; line-height:1.35; }
.rtbl td.pass{ color:var(--good); }
.rtbl td.bad{ color:var(--bad); }
.pbtn2[disabled]{ opacity:.35; pointer-events:none; }
.pkgrid.off{ opacity:.4; pointer-events:none; }
#sheet{ z-index:25; }
.ghd{ display:flex; justify-content:space-between; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); cursor:pointer; padding-bottom:5px; }
#graphs.min #gc{ display:none; }
#graphs.min .ghd{ padding-bottom:0; }
#stage.tight #live{ width:210px; padding:8px 10px; }
#stage.tight #graphs{ width:min(320px,calc(100% - 246px)); min-width:200px; }
#stage.tight #gc{ height:84px; }
#gc{ position:static; inset:auto; display:block; width:100%; height:176px; touch-action:auto; }
#rbar{ position:absolute; left:12px; right:12px; bottom:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  background:rgba(14,20,28,.93); border:1px solid var(--edge2); border-radius:11px; padding:8px 10px; backdrop-filter:blur(8px); }
#rbar[hidden]{ display:none; }
#rbar input[type=range]{ flex:1 1 140px; min-width:100px; }
#rbar .chip{ font-variant-numeric:tabular-nums; min-width:88px; }
.tools{ display:flex; gap:8px; }
.tools[hidden]{ display:none; }
.tools .btn{ padding:6px 11px; font-size:12.5px; }
.rcard{ display:grid; gap:5px; border:1px solid var(--edge); border-radius:11px; padding:10px 12px; background:rgba(255,255,255,.04); }
.rcard.top{ border-color:rgba(255,196,0,.45); }
.rcard b{ font-size:14px; font-variant-numeric:tabular-nums; }
.rcard small{ color:var(--dim); font-size:12.5px; line-height:1.4; }
.rcard .lrow .btn{ padding:5px 9px; font-size:12.5px; }
@media (max-width:860px){ #graphs{ left:12px; right:12px; top:auto; bottom:12px; width:auto; } #rbar{ top:12px; bottom:auto; } #report:not([hidden]) ~ #graphs{ display:none; } #gc{ height:84px; } #rbar{ padding:6px 8px; gap:6px; } #rbar .chip{ min-width:0; } }


#sag{ position:absolute; inset:0; pointer-events:none; z-index:5; animation:sagp 1.1s ease-in-out infinite; }
#sag[hidden]{ display:none; }
#sag b{ position:absolute; left:50%; bottom:52px; transform:translateX(-50%); background:rgba(40,10,12,.92); border:1px solid var(--bad);
  color:var(--bad); padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap; }
@keyframes sagp{ 0%,100%{ box-shadow:inset 0 0 40px 2px rgba(255,107,112,.16); } 50%{ box-shadow:inset 0 0 90px 12px rgba(255,107,112,.42); } }
#pad{ position:absolute; left:14px; bottom:46px; display:flex; gap:14px; align-items:flex-end; z-index:6; user-select:none; -webkit-user-select:none; }
#pad[hidden]{ display:none; }
#pad .dpad{ display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(2,56px); gap:6px; }
#pad button{ border:1px solid var(--edge2); background:rgba(20,28,38,.92); color:var(--text); border-radius:14px; font-size:20px; font-weight:700; touch-action:none; padding:0; }
#pad button.on, #pad button:active{ background:var(--hazard); color:#1A1400; }
#pad button[hidden]{ display:none; }
#pad [data-k="w"]{ grid-column:2; grid-row:1; } #pad [data-k="a"]{ grid-column:1; grid-row:2; }
#pad [data-k="s"]{ grid-column:2; grid-row:2; } #pad [data-k="d"]{ grid-column:3; grid-row:2; }
#pad .grip{ height:56px; padding:0 18px; font-size:15px; }
#stage.padon #graphs{ display:none; }
#side .gears .chip2, #side .bats .chip2{ min-width:0; padding:8px 2px; font-size:12px; }
#side .row input[type=range]{ min-width:0; }
#toast .tbtn{ margin-left:6px; border:1px solid var(--hazard); background:none; color:var(--hazard); border-radius:999px; padding:3px 12px; font-size:13px; font-weight:600; cursor:pointer; }
#toast .tbtn:hover{ background:var(--hazard); color:#1A1400; }
.pgrid{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
.pbtn2{ min-width:0; overflow:hidden; font-size:12px; }
#side .card, #side .row{ min-width:0; }
@media (max-width:860px){
  #pad{ left:50%; transform:translateX(-50%); bottom:10px; gap:8px; }
  #pad .dpad{ grid-template-columns:repeat(4,48px); grid-template-rows:48px; gap:6px; }
  #pad [data-k="a"]{ grid-column:1; grid-row:1; } #pad [data-k="w"]{ grid-column:2; grid-row:1; }
  #pad [data-k="s"]{ grid-column:3; grid-row:1; } #pad [data-k="d"]{ grid-column:4; grid-row:1; }
  #pad .grip{ height:48px; padding:0 14px; font-size:14px; }
}
@media (max-width:600px){
  #app{ grid-template-columns:minmax(0,1fr); }
  header{ padding:8px 10px; gap:4px; flex-wrap:nowrap; min-width:0; }
  header .mark{ display:none; }
  header .btn{ padding:6px 6px; font-size:12px; min-height:38px; white-space:nowrap; }
  .tabs button{ padding:6px 10px; font-size:13px; }
  footer{ padding:8px 10px; gap:6px 8px; }
  footer .btn{ padding:6px 9px; font-size:12.5px; min-height:38px; }
  footer .btn.big{ padding:7px 16px; font-size:14px; }
  footer .status{ font-size:12px; }
}
@media (max-width:380px){
  header .btn{ padding:6px 4px; font-size:11.5px; }
  .tabs button{ padding:6px 8px; font-size:12.5px; }
}
#tour{ position:fixed; inset:0; z-index:60; }
#tour[hidden]{ display:none; }
#tourSpot{ position:fixed; border-radius:12px; box-shadow:0 0 0 9999px rgba(6,10,15,.76); border:2px solid var(--hazard); pointer-events:none; transition:left .25s ease, top .25s ease, width .25s ease, height .25s ease; }
#tourCard{ position:fixed; background:var(--panel); border:1px solid var(--edge2); border-radius:14px; padding:14px 16px 12px; box-shadow:0 12px 44px rgba(0,0,0,.55); display:grid; gap:8px; }
#tourCard h3{ margin:0; font-size:16px; }
#tourCard p{ margin:0; font-size:13.5px; line-height:1.5; color:var(--dim); }
#tourCard .tfoot{ display:flex; align-items:center; gap:8px; margin-top:4px; }
#tourDots{ display:flex; gap:5px; flex:1; }
#tourDots i{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.2); }
#tourDots i.on{ background:var(--hazard); }
#tourCard .skip{ border:0; background:none; color:var(--dim); font-size:12.5px; padding:6px 4px; }
#tourBack[hidden]{ display:none; }
@media (pointer:coarse){
  .btn, .chip2, .pbtn2, select{ min-height:44px; }
  input[type=range]{ height:30px; }
  .rule .x{ min-width:34px; min-height:34px; }
}
@media (prefers-reduced-motion:reduce){ #sag{ animation:none; box-shadow:inset 0 0 70px 6px rgba(255,107,112,.3); } #tourSpot{ transition:none; } }

@media (max-width:860px){
  main{ grid-template-columns:1fr; grid-template-rows:1fr auto; }
  #side{ border-right:0; border-top:1px solid var(--edge); max-height:38vh; order:2; }
  #stage{ order:1; }
  .tagline{ display:none; }
  footer{ padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark">Bench<span>.</span></div>
    <div class="tagline">Build a robot, then find out what you got wrong.</div>
    <div class="grow"></div>
    <button class="btn" id="btnLessons">Lessons</button>
    <button class="btn" id="btnRecords">Records</button>
    <button class="btn" id="btnClass">Classroom</button>
    <button class="btn" id="btnTour" aria-label="Replay the intro tour">Tour</button>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabBuild" aria-selected="true">Build</button>
      <button role="tab" id="tabRun" aria-selected="false">Run</button>
    </div>
    <select id="challenge" aria-label="Challenge" style="display:none">
      <option value="line">Line track</option>
      <option value="maze">Maze</option>
      <option value="sumo">Sumo ring</option>
      <option value="hill">Hill climb</option>
      <option value="drag">Drag race</option>
      <option value="course">Obstacle course</option>
      <option value="deliver">Payload run</option>
      <option value="free">Free play</option>
    </select>
  </header>

  <main>
    <div id="side"></div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="sag" hidden><b id="sagT"></b></div>
      <div id="pad" hidden aria-label="Drive pad">
        <div class="dpad"><button data-k="w" aria-label="Forward">^</button><button data-k="a" aria-label="Turn left">&lt;</button><button data-k="s" aria-label="Reverse">v</button><button data-k="d" aria-label="Turn right">&gt;</button></div>
        <button class="grip" id="padGrip" hidden>Grip</button>
      </div>
      <div id="live" hidden></div>
      <div id="report" hidden>
        <button class="close" id="reportClose" aria-label="Close report">x</button>
        <h3 id="repTitle">Run finished</h3>
        <div class="chip" id="repSub"></div>
        <ul id="repList"></ul>
        <div class="btnrow" style="margin-top:6px"><button class="btn" id="repWatch">Watch replay</button><button class="btn" id="repRec">Records</button><button class="btn" id="repCsv">Run data (CSV)</button></div>
      </div>

<script>
(function(){
"use strict";
var TEST = /benchtest/.test(location.search);
var TAU = Math.PI * 2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function el(id){ return document.getElementById(id); }

function Robot(spec){
  this.parts = spec.parts.slice();
  this.chassis = spec.chassis || { w:16, h:20 };
  this.reset(spec.x||0, spec.y||0, spec.th||0);
  this.recompute();
}
Robot.prototype.reset = function(x,y,th){
  this.x=x; this.y=y; this.th=th; this.vx=0; this.vy=0; this.w=0;
  this.slipTime=0; this.runTime=0; this.dragTime=0; this.distance=0; this.bumped=false; this.bumpCount=0; this.stallTime=0;
};
Robot.prototype.recompute = function(){
  var chassisMass = this.chassis.w*this.chassis.h*0.0045 + 0.25, mx=0,my=0,m=chassisMass,i;
  for(i=0;i<this.parts.length;i++){ var p=this.parts[i]; m+=p.mass; mx+=p.mass*p.x; my+=p.mass*p.y; }
  this.mass=m; this.comx=mx/m; this.comy=my/m;
  var I = chassisMass*(this.chassis.w*this.chassis.w+this.chassis.h*this.chassis.h)/120000;
  I += chassisMass*((this.comx*this.comx+this.comy*this.comy)/10000);
  for(i=0;i<this.parts.length;i++){
    var q=this.parts[i], dx=(q.x-this.comx)/100, dy=(q.y-this.comy)/100;
    I += q.mass*(dx*dx+dy*dy);
  }
  this.inertia=Math.max(0.002,I);
  this.wheels=this.parts.filter(function(p){return p.type==='wheel';});
  this.supports=this.parts.filter(function(p){return p.type==='wheel'||p.type==='caster';});
  this.loads=this.supportLoads();
};
Robot.prototype.supportLoads = function(){
  var s=this.supports,out=[],tot=0,i;
  if(!s.length) return out;
  for(i=0;i<s.length;i++){
    var dx=s[i].x-this.comx, dy=s[i].y-this.comy;
    var w=1/(2.5+Math.sqrt(dx*dx+dy*dy));
    out.push(w); tot+=w;
  }
  for(i=0;i<out.length;i++) out[i]=out[i]/tot*this.mass*9.81;
  return out;
};
Robot.prototype.hull = function(){
  var pts=this.supports.map(function(p){return [p.x,p.y];});
  if(pts.length<3) return pts;
  pts.sort(function(a,b){return a[0]-b[0]||a[1]-b[1];});
  function cross(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);}
  var h=[],j;
  for(j=0;j<pts.length;j++){ while(h.length>=2&&cross(h[h.length-2],h[h.length-1],pts[j])<=0)h.pop(); h.push(pts[j]); }
  var lower=h.length+1;
  for(j=pts.length-2;j>=0;j--){ while(h.length>=lower&&cross(h[h.length-2],h[h.length-1],pts[j])<=0)h.pop(); h.push(pts[j]); }
  h.pop(); return h;
};
Robot.prototype.comSupported = function(){
  var hull=this.hull(); if(hull.length<3) return false;
  var ins=false;
  for(var k=0,l=hull.length-1;k<hull.length;l=k++){
    if(((hull[k][1]>this.comy)!==(hull[l][1]>this.comy)) &&
       (this.comx<(hull[l][0]-hull[k][0])*(this.comy-hull[k][1])/(hull[l][1]-hull[k][1])+hull[k][0])) ins=!ins;
  }
  return ins;
};
Robot.prototype.stability = function(){
  var s=this.supports;
  if(s.length<2) return 0;
  if(s.length===2){
    var L=Math.hypot(s[1].x-s[0].x,s[1].y-s[0].y)||1;
    var d=Math.abs((s[1].x-s[0].x)*(this.comy-s[0].y)-(s[1].y-s[0].y)*(this.comx-s[0].x))/L;
    return d<1.2?0.45:0;
  }
  return this.comSupported()?1:0.15;
};
Robot.prototype.toWorld = function(px,py){
  var c=Math.cos(this.th), sn=Math.sin(this.th);
  return [this.x+px*sn+py*c, this.y-px*c+py*sn];
};
Robot.prototype.toWorldVec = function(px,py){
  var c=Math.cos(this.th), sn=Math.sin(this.th);
  return [px*sn+py*c, -px*c+py*sn];
};
Robot.prototype.step = function(dt,cmd,world){
  var SUB=6,h=dt/SUB;
  this.bumped=false;
  for(var s=0;s<SUB;s++) this.substep(h,cmd,world);
  if(!this.noPower){
    var amps=0.12;
    for(var wi=0;wi<this.wheels.length;wi++) amps+=this.wheels[wi]._amps||0;
    if(batt.soc<=0) amps=0.12;
    batt.i=amps;
    batt.used+=amps*dt/3.6;
    batt.soc=clamp(1-batt.used/Math.max(1,batt.cap),0,1);
    var voc=PACK.cutoff+(PACK.nominal-PACK.cutoff)*(0.12+0.88*Math.pow(batt.soc,0.55));
    batt.v=Math.max(3.5,voc-amps*PACK.rint*3.2);
    if(batt.v<batt.minV) batt.minV=batt.v;
    if(amps>batt.peakI) batt.peakI=amps;
    var st=0;
    for(wi=0;wi<this.wheels.length;wi++) if((this.wheels[wi]._load||0)>0.75) st=1;
    this.stallTime=(this.stallTime||0)+st*dt;
  }
  this.runTime+=dt;
  if(this.bumped && !this.wasBumped) this.bumpCount++;
  this.wasBumped=this.bumped;
};
Robot.prototype.substep = function(h,cmd,world){
  var i, MU=0.85, GRIP=0.9, stab=this.stability();
  for(i=0;i<this.wheels.length;i++){
    var wl=this.wheels[i], N=this.loads[this.supports.indexOf(wl)]||0;
    var rw=this.toWorldVec((wl.x-this.comx)/100,(wl.y-this.comy)/100);
    var rx=rw[0], ry=rw[1], a=this.th+(wl.angle||0);
    var fx=Math.cos(a), fy=Math.sin(a), lx=-fy, ly=fx;
    var pvx=this.vx-this.w*ry*100, pvy=this.vy+this.w*rx*100;
    var vf=pvx*fx+pvy*fy, vl=pvx*lx+pvy*ly;
    var duty=(cmd[wl.id]||0)*(wl.reversed?-1:1);
    var vfac=this.noPower?1:clamp(batt.v/PACK.nominal,0.3,1.05);
    var v0=wl.maxSpeed*vfac, F0=wl.maxForce*vfac;
    var drive=duty*v0;
    var effM=this.mass/Math.max(1,this.wheels.length);
    var Jf=effM*(drive-vf)/100, Jl=-effM*vl/100*GRIP;
    var el=ELEC[wl.motor]||ELEC.dc;
    var load;
    if(wl.motor==="step") load=Math.abs(duty)*(Math.abs(vf)<v0?1:0.4);
    else load=clamp(Math.abs(duty-vf/Math.max(4,v0)),0,1.25);
    var Fcap=(wl.motor==="step")?F0*(Math.abs(vf)<v0?1:0):F0*Math.min(1,load);
    wl._load=Math.min(1,load);
    wl._amps=(wl.motor==="step")?(el.stall*Math.abs(duty)+el.idle*0.3)
                                :(el.stall*Math.min(1.25,load)+el.idle*Math.abs(duty));
    var maxF=Fcap*h, lim=surfLim(this,wl,rx,ry,N,h,world);
    if(Math.abs(Jf)>maxF) Jf=(Jf<0?-1:1)*maxF;
    var mag=Math.hypot(Jf,Jl);
    var ksl=1;
    if(mag>lim&&mag>0){ var k=lim/mag; ksl=k; Jf*=k; Jl*=k; this.slipTime+=h; }
    wl._ws=vf+(drive-vf)*(1-ksl);
    wl._vf=vf;
    var Jx=Jf*fx+Jl*lx, Jy=Jf*fy+Jl*ly;
    this.vx+=Jx/this.mass*100; this.vy+=Jy/this.mass*100;
    this.w+=(rx*Jy-ry*Jx)/this.inertia;
  }
  if(stab<0.99){
    this.dragTime+=h*(1-stab);
    var d=Math.exp(-h*7.5*(1-stab));
    this.vx*=d; this.vy*=d; this.w*=Math.exp(-h*5*(1-stab));
  }
  slopeStep(this,h,world);
  var dmp=Math.exp(-h*(0.55+(this._sd||0)));
  this.vx*=dmp; this.vy*=dmp; this.w*=Math.exp(-h*0.5);
  var px=this.x, py=this.y;
  this.x+=this.vx*h; this.y+=this.vy*h; this.th+=this.w*h;
  this.distance+=Math.hypot(this.x-px,this.y-py);
  if(world&&world.walls) this.collide(world.walls);
  if(world&&world.obstacles) this.collideRound(world.obstacles);
};
Robot.prototype.corners = function(){
  var hw=this.chassis.w/2, hh=this.chassis.h/2, self=this;
  return [[hw,hh],[-hw,hh],[-hw,-hh],[hw,-hh]].map(function(p){ return self.toWorld(p[0],p[1]); });
};
Robot.prototype.collide = function(walls){
  var corners=this.corners();
  for(var i=0;i<walls.length;i++){
    var W=walls[i];
    for(var k=0;k<4;k++){
      var px=corners[k][0], py=corners[k][1];
      if(px<W.x0||px>W.x1||py<W.y0||py>W.y1) continue;
      var dx=Math.min(px-W.x0,W.x1-px), dy=Math.min(py-W.y0,W.y1-py), nx=0,ny=0,pen;
      if(dx<dy){ pen=dx; nx=(px-W.x0<W.x1-px)?-1:1; } else { pen=dy; ny=(py-W.y0<W.y1-py)?-1:1; }
      this.x+=nx*pen; this.y+=ny*pen;
      var vn=this.vx*nx+this.vy*ny;
      if(vn<0){ this.vx-=vn*nx*1.2; this.vy-=vn*ny*1.2; }
      this.w*=0.6; this.bumped=true;
      corners=this.corners();
    }
  }
};
var OBS_GIVE={ cone:0.62, ball:0.80, crate:0.14 };
Robot.prototype.collideRound = function(obs){
  var c=Math.cos(this.th), sn=Math.sin(this.th);
  var hw=this.chassis.w/2, hh=this.chassis.h/2;
  for(var i=0;i<obs.length;i++){
    var o=obs[i];
    if(o.held) continue;
    var dx=o.x-this.x, dy=o.y-this.y;
    var lx=dx*sn-dy*c, ly=dx*c+dy*sn;
    var qx=clamp(lx,-hw,hw), qy=clamp(ly,-hh,hh);
    var ex=lx-qx, ey=ly-qy, d=Math.hypot(ex,ey), nx, ny;
    if(d>1e-6){ nx=ex/d; ny=ey/d; }
    else {
      var ox=hw-Math.abs(lx), oy=hh-Math.abs(ly);
      if(ox<oy){ nx=lx<0?-1:1; ny=0; d=-ox; } else { nx=0; ny=ly<0?-1:1; d=-oy; }
    }
    if(d>=o.r) continue;
    var pen=o.r-d;
    var wnx=nx*sn+ny*c, wny=-nx*c+ny*sn;
    var give=OBS_GIVE[o.kind]||0.3;
    o.x+=wnx*pen*give; o.y+=wny*pen*give;
    this.x-=wnx*pen*(1-give); this.y-=wny*pen*(1-give);
    var vn=this.vx*wnx+this.vy*wny;
    if(vn>0){ this.vx-=vn*wnx*(1.1-give); this.vy-=vn*wny*(1.1-give); }
    this.w*=0.82;
    this.bumped=true;
  }
};

var MOTORS={
  dc:   { label:"DC",          speed:46, force:6.5, mass:0.11, note:"Cheap and quick. No idea how far it has turned." },
  enc:  { label:"DC + encoder",speed:44, force:6.3, mass:0.13, note:"Counts every turn, so you can measure distance." },
  step: { label:"Stepper",     speed:26, force:9.2, mass:0.17, note:"Slow but strong and exact. Heavy." }
};
var ELEC={ dc:{stall:2.6,idle:0.18}, enc:{stall:2.5,idle:0.20}, step:{stall:1.7,idle:1.05} };
var PACK={ nominal:8.4, cutoff:6.0, rint:0.085 };
var batt={ v:8.4, i:0, used:0, soc:1, cap:1500, minV:8.4, peakI:0 };
function packCapacity(r){
  var m=0;
  for(var i=0;i<r.parts.length;i++) if(r.parts[i].type==="ballast") m+=r.parts[i].mass;
  return m>0 ? Math.round(700+m*1700) : 600;
}
function resetBattery(){
  batt.cap=packCapacity(robot); batt.used=0; batt.soc=1; batt.v=PACK.nominal;
  batt.i=0; batt.minV=PACK.nominal; batt.peakI=0;
}
function applyMotor(p){
  var m=MOTORS[p.motor]||MOTORS.dc;
  p.maxSpeed=m.speed; p.maxForce=m.force; p.mass=m.mass;
}
var CATALOG = {
  wheel:   { label:"Motor + wheel", mass:0.11, note:"A motor and wheel. You need two to steer.",
             make:function(){ return { type:"wheel", x:-8.5, y:1, angle:0, mass:0.11, motor:"dc",
                                       maxSpeed:46, maxForce:6.5, reversed:false, ticks:0 }; } },
  caster:  { label:"Caster ball", mass:0.03, note:"A free-rolling support. Stops the chassis scraping.",
             make:function(){ return { type:"caster", x:0, y:-8, mass:0.03 }; } },
  line:    { label:"Line sensor", mass:0.02, note:"Looks straight down and reports how dark the floor is.",
             make:function(){ return { type:"line", x:-2, y:9, mass:0.02 }; } },
  ir:      { label:"IR distance", mass:0.02, note:"Narrow infrared beam. Only 4 to 30 cm, and it is noisy.",
             make:function(){ return { type:"ir", x:0, y:10, angle:0, mass:0.02 }; } },
  us:      { label:"Ultrasonic", mass:0.05, note:"Sees 2 to 200 cm with a wide cone, but updates slowly and misses slanted walls.",
             make:function(){ return { type:"us", x:0, y:10, angle:0, mass:0.05, hold:200, next:0 }; } },
  servo:   { label:"Servo mast", mass:0.06, note:"Sweeps any sensor bolted near it from side to side.",
             make:function(){ return { type:"servo", x:0, y:5, angle:0, mass:0.06, sweep:true, pos:0 }; } },
  bumper:  { label:"Bumper", mass:0.05, note:"Tells you when you have hit something.",
             make:function(){ return { type:"bumper", x:0, y:11, mass:0.05 }; } },
  ballast: { label:"Battery pack", mass:0.45, note:"Heavy. Where you put it changes how the wheels grip.",
             make:function(){ return { type:"ballast", x:0, y:0, mass:0.45 }; } }
};
var CHASSIS = { w:14, h:22 };
var build = { parts:[], nextId:1 };
function addPart(kind){
  var p = CATALOG[kind].make();
  p.id = kind + (build.nextId++);
  p.kind = kind;

  for(var tries=0; tries<40; tries++){
    var clash=false;
    for(var i=0;i<build.parts.length;i++){
      var q=build.parts[i];
      if(Math.hypot(q.x-p.x,q.y-p.y)<3.4){ clash=true; break; }
    }
    if(!clash) break;
    p.x += (tries%2?-1:1)*(3.5+tries*0.7);
    if(Math.abs(p.x)>CHASSIS.w/2+2){ p.x=-7; p.y-=3.5; }
  }
  clampPart(p);
  build.parts.push(p);
  selected = p;
  rebuild();
  return p;
}
function clampPart(p){
  var lim = p.type==="wheel" ? CHASSIS.w/2+2.5 : CHASSIS.w/2-1;
  p.x = clamp(p.x, -lim, lim);
  p.y = clamp(p.y, -CHASSIS.h/2+1, CHASSIS.h/2+1.5);
}
var selected = null, robot = null;
function rebuild(){
  robot = new Robot({ parts:build.parts, chassis:CHASSIS, x:0, y:0, th:Math.PI/2 });
  lessonLive();
  drawSide();
}
function starterBuild(){
  build.parts=[]; build.nextId=1;
  var l=addPart("wheel"); l.x=-8.5; l.y=1;
  var r=addPart("wheel"); r.x=8.5; r.y=1;
  var c=addPart("caster"); c.x=0; c.y=-9;
  var s1=addPart("line"); s1.x=-2.5; s1.y=10;
  var s2=addPart("line"); s2.x=2.5; s2.y=10;
  var d=addPart("us"); d.x=0; d.y=11; d.angle=0;
  var d2=addPart("ir"); d2.x=-5; d2.y=8; d2.angle=1.05;
  var b=addPart("ballast"); b.x=0; b.y=0;
  selected=null; rebuild();
}

var ARENA = { w:250, h:175 };
var world = null;
function wall(x0,y0,x1,y1){ return { x0:Math.min(x0,x1), y0:Math.min(y0,y1), x1:Math.max(x0,x1), y1:Math.max(y0,y1) }; }
function border(t){
  var W=ARENA.w/2, H=ARENA.h/2;
  return [wall(-W-t,-H-t,W+t,-H), wall(-W-t,H,W+t,H+t), wall(-W-t,-H,-W,H), wall(W,-H,W+t,H)];
}
var obstacles=[];
function makeWorld(kind){
  var w = { kind:kind, walls:border(6), track:null, goal:null, checkpoints:null, rival:null, start:{x:0,y:0,th:Math.PI/2} };
  w.obstacles=obstacles;
  if(kind==="line"){
    var pts=[], i, cx=0, cy=0;
    for(i=0;i<=120;i++){
      var t=i/120*TAU;
      pts.push([cx+Math.cos(t)*88*(1+0.16*Math.sin(t*2)), cy+Math.sin(t)*58*(1+0.12*Math.cos(t*3))]);
    }
    w.track=pts;
    w.checkpoints=[0,30,60,90].map(function(k){ return { x:pts[k][0], y:pts[k][1], hit:false }; });
    w.start={ x:pts[0][0], y:pts[0][1]-0, th:Math.atan2(pts[3][1]-pts[0][1], pts[3][0]-pts[0][0]) };
  } else if(kind==="maze"){

    var COLS=6, ROWS=4, CELL=40, T=3;
    var ox=-COLS*CELL/2, oy=-ROWS*CELL/2;
    var vert=[], horz=[], c, rr;
    for(c=0;c<=COLS;c++){ vert.push([]); for(rr=0;rr<ROWS;rr++) vert[c].push(true); }
    for(c=0;c<COLS;c++){ horz.push([]); for(rr=0;rr<=ROWS;rr++) horz[c].push(true); }
    var seen=[], stack=[[0,0]];
    for(c=0;c<COLS;c++){ seen.push([]); for(rr=0;rr<ROWS;rr++) seen[c].push(false); }
    seen[0][0]=true;
    var rnd=(function(a){ return function(){ a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; })(20260927);
    while(stack.length){
      var cur=stack[stack.length-1], cx=cur[0], cy=cur[1];
      var nb=[];
      if(cx>0&&!seen[cx-1][cy]) nb.push([cx-1,cy,"W"]);
      if(cx<COLS-1&&!seen[cx+1][cy]) nb.push([cx+1,cy,"E"]);
      if(cy>0&&!seen[cx][cy-1]) nb.push([cx,cy-1,"S"]);
      if(cy<ROWS-1&&!seen[cx][cy+1]) nb.push([cx,cy+1,"N"]);
      if(!nb.length){ stack.pop(); continue; }
      var pick=nb[(rnd()*nb.length)|0];
      if(pick[2]==="W") vert[cx][cy]=false;
      if(pick[2]==="E") vert[cx+1][cy]=false;
      if(pick[2]==="S") horz[cx][cy]=false;
      if(pick[2]==="N") horz[cx][cy+1]=false;
      seen[pick[0]][pick[1]]=true;
      stack.push([pick[0],pick[1]]);
    }
    w.maze={ COLS:COLS, ROWS:ROWS, CELL:CELL, ox:ox, oy:oy, vert:vert, horz:horz };
    for(c=0;c<=COLS;c++) for(rr=0;rr<ROWS;rr++) if(vert[c][rr])
      w.walls.push(wall(ox+c*CELL-T, oy+rr*CELL-T, ox+c*CELL+T, oy+(rr+1)*CELL+T));
    for(c=0;c<COLS;c++) for(rr=0;rr<=ROWS;rr++) if(horz[c][rr])
      w.walls.push(wall(ox+c*CELL-T, oy+rr*CELL-T, ox+(c+1)*CELL+T, oy+rr*CELL+T));
    w.start={ x:ox+CELL/2, y:oy+CELL/2, th:Math.PI/2 };
    w.goal={ x:ox+(COLS-0.5)*CELL, y:oy+(ROWS-0.5)*CELL, r:15 };
  } else if(kind==="sumo"){
    w.walls=border(6);
    w.ring={ x:0, y:0, r:70 };
    w.start={ x:0, y:-26, th:Math.PI/2 };
    w.rival=true;
  } else {
    w.walls=w.walls.concat([wall(-40,20,-10,50), wall(30,-50,70,-20), wall(-90,-60,-60,-40)]);
    w.start={ x:0, y:-50, th:Math.PI/2 };
  }
  return w;
}
var trackMask=null, MASK_S=2;
function buildMask(){
  var w=Math.ceil(ARENA.w*MASK_S)+8, h=Math.ceil(ARENA.h*MASK_S)+8;
  var c=document.createElement("canvas"); c.width=w; c.height=h;
  var x=c.getContext("2d", { willReadFrequently:true });
  x.fillStyle="#fff"; x.fillRect(0,0,w,h);
  if(world && world.track){
    x.strokeStyle="#000"; x.lineWidth=3*MASK_S; x.lineJoin="round"; x.lineCap="round";
    x.beginPath();
    for(var i=0;i<world.track.length;i++){
      var p=world.track[i], px=(p[0]+ARENA.w/2)*MASK_S+4, py=(p[1]+ARENA.h/2)*MASK_S+4;
      if(i===0) x.moveTo(px,py); else x.lineTo(px,py);
    }
    if(!world.open) x.closePath();
    x.stroke();
  }
  drawMarksMask(x,w,h);
  var d=x.getImageData(0,0,w,h).data, m=new Uint8Array(w*h);
  for(var k=0;k<w*h;k++) m[k]=255-d[k*4];
  trackMask={ m:m, w:w, h:h };
}
function lineAt(wx,wy){
  if(!trackMask) return 0;
  var px=Math.round((wx+ARENA.w/2)*MASK_S+4), py=Math.round((wy+ARENA.h/2)*MASK_S+4);
  if(px<0||py<0||px>=trackMask.w||py>=trackMask.h) return 0;
  return trackMask.m[py*trackMask.w+px]/255;
}
function rayCast(x,y,ang,max){
  var dx=Math.cos(ang), dy=Math.sin(ang), best=max;
  for(var i=0;i<world.walls.length;i++){
    var W=world.walls[i];
    var t0=0, t1=best;
    var ok=true;
    var lo, hi, inv;
    if(Math.abs(dx)<1e-9){ if(x<W.x0||x>W.x1) ok=false; }
    else { inv=1/dx; lo=(W.x0-x)*inv; hi=(W.x1-x)*inv; if(lo>hi){var tmp=lo;lo=hi;hi=tmp;} t0=Math.max(t0,lo); t1=Math.min(t1,hi); }
    if(ok){
      if(Math.abs(dy)<1e-9){ if(y<W.y0||y>W.y1) ok=false; }
      else { inv=1/dy; lo=(W.y0-y)*inv; hi=(W.y1-y)*inv; if(lo>hi){var t2=lo;lo=hi;hi=t2;} t0=Math.max(t0,lo); t1=Math.min(t1,hi); }
    }
    if(ok&&t0<=t1&&t0>=0&&t0<best) best=t0;
  }
  if(world.obstacles){
    for(var oi=0;oi<world.obstacles.length;oi++){
      var ob=world.obstacles[oi];
      var ex=ob.x-x, ey=ob.y-y, tca=ex*dx+ey*dy;
      if(tca<0) continue;
      var dd=ex*ex+ey*ey-tca*tca;
      if(dd>ob.r*ob.r) continue;
      var t0b=tca-Math.sqrt(ob.r*ob.r-dd);
      if(t0b>=0&&t0b<best) best=t0b;
    }
  }
  if(world.rivalBot){
    var r=world.rivalBot, cs=r.corners();
    for(var k=0;k<4;k++){
      var a=cs[k], b=cs[(k+1)%4];
      var ex=b[0]-a[0], ey=b[1]-a[1];
      var den=dx*ey-dy*ex;
      if(Math.abs(den)<1e-9) continue;
      var t=((a[0]-x)*ey-(a[1]-y)*ex)/den;
      var u=((a[0]-x)*dy-(a[1]-y)*dx)/den;
      if(t>=0&&t<best&&u>=0&&u<=1) best=t;
    }
  }
  return best;
}

function readSensors(r){
  var s={ lines:[], lineLeft:0, lineRight:0, lineAny:0, dist:999, bumper:false, sawLine:false };
  var lineParts=r.parts.filter(function(p){return p.type==="line";});
  lineParts.sort(function(a,b){ return a.x-b.x; });
  for(var i=0;i<lineParts.length;i++){
    var p=lineParts[i], w=r.toWorld(p.x,p.y), v=lineAt(w[0],w[1]);
    s.lines.push({ part:p, v:v, x:w[0], y:w[1] });
    if(v>0.4) s.lineAny=1;
  }
  if(lineParts.length){
    var lefts=s.lines.filter(function(q){return q.part.x<0;}), rights=s.lines.filter(function(q){return q.part.x>=0;});
    s.lineLeft = lefts.length? Math.max.apply(null,lefts.map(function(q){return q.v;})) : 0;
    s.lineRight= rights.length? Math.max.apply(null,rights.map(function(q){return q.v;})) : 0;
  }
  var dps=r.parts.filter(function(p){return p.type==="ir"||p.type==="us"||p.type==="dist";});
  var servos=r.parts.filter(function(p){return p.type==="servo";});
  s.rays=[]; s.distFwd=999; s.distL=999; s.distR=999; s.probes=[];
  for(var d=0;d<dps.length;d++){
    var dp=dps[d], w2=r.toWorld(dp.x,dp.y);
    var pan=0;
    for(var v=0;v<servos.length;v++){
      if(Math.hypot(servos[v].x-dp.x,servos[v].y-dp.y)<5.5){ pan=servos[v].pos||0; break; }
    }
    var a=(dp.angle||0)+pan, ang=r.th+a, hit;
    if(dp.type==="us"){
      hit=200;
      for(var k2=-2;k2<=2;k2++){
        var h2=rayCast(w2[0],w2[1],ang+k2*0.105,200);
        if(h2<hit) hit=h2;
      }
      hit=clamp(hit*(1+(Math.random()-0.5)*0.02),2,200);
      if(runT>=(dp.next||0)||runT<(dp.next||0)-1){ dp.hold=hit; dp.next=runT+0.05; }
      hit=dp.hold;
    } else {
      hit=rayCast(w2[0],w2[1],ang,40);
      hit=hit*(1+(Math.random()-0.5)*0.07);
      if(hit>30) hit=30; else if(hit<4) hit=4;
    }
    s.rays.push({ x:w2[0], y:w2[1], ang:ang, d:hit, kind:dp.type, part:dp });
    s.probes.push({ part:dp, v:hit });
    if(Math.abs(a)<0.52) s.distFwd=Math.min(s.distFwd,hit);
    else if(a>0) s.distL=Math.min(s.distL,hit);
    else s.distR=Math.min(s.distR,hit);
    if(hit<s.dist) s.dist=hit;
  }
  var bp=r.parts.filter(function(p){return p.type==="bumper";})[0];
  s.bumper = !!bp && r.bumped;
  return s;
}

var mode="rules", lastCmd={};
var keys=Object.create(null);
var rules=[
  { cond:"lineLeft", op:">", val:0.4, act:"left" },
  { cond:"lineRight", op:">", val:0.4, act:"right" },
  { cond:"always", op:">", val:0, act:"forward" }
];
var tuneBehaviour="line";
var AUTO_BEH={ line:"line", maze:"wall", sumo:"charge", free:"line" };
var AUTO_TUNE={ line:{speed:0.7,gain:1.4,target:25}, wall:{speed:0.55,gain:2.2,target:22},
                charge:{speed:1.0,gain:1.6,target:25} };
function autoConfigure(kind){
  tuneBehaviour=AUTO_BEH[kind]||"line";
  var t=AUTO_TUNE[tuneBehaviour];
  tune.speed=t.speed; tune.gain=t.gain; tune.target=t.target;
}
var tune={ speed:0.7, gain:1.4, target:25 };
var wallTurn=0, WALL_CLEAR=40;
var ACTIONS={
  forward:[1,1], back:[-1,-1], left:[0.15,0.9], right:[0.9,0.15],
  spinL:[-0.7,0.7], spinR:[0.7,-0.7], stop:[0,0]
};
function condValue(s,c){
  if(c==="lineLeft") return s.lineLeft;
  if(c==="lineRight") return s.lineRight;
  if(c==="lineAny") return s.lineAny;
  if(c==="dist") return s.dist;
  if(c==="distFwd") return s.distFwd;
  if(c==="distL") return s.distL;
  if(c==="distR") return s.distR;
  if(c==="bumper") return s.bumper?1:0;
  return 1;
}
function control(r,s){
  var L=0,R=0;
  if(mode==="drive"){
    var f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
    var t=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
    L=clamp(f+t*0.85,-1,1); R=clamp(f-t*0.85,-1,1);
    if(f===0&&t!==0){ L=t*0.8; R=-t*0.8; }
  } else if(mode==="rules"){
    var act="stop";
    for(var i=0;i<rules.length;i++){
      var ru=rules[i], v=condValue(s,ru.cond);
      var pass = ru.cond==="always" ? true : (ru.op===">" ? v>ru.val : v<ru.val);
      if(pass){ act=ru.act; break; }
    }
    var pair=ACTIONS[act]||[0,0]; L=pair[0]; R=pair[1];
  } else {
    if(tuneBehaviour==="line"){
      var err=s.lineRight-s.lineLeft;
      L=clamp(tune.speed+err*tune.gain,-1,1);
      R=clamp(tune.speed-err*tune.gain,-1,1);
      if(s.lineLeft<0.15&&s.lineRight<0.15){ L=tune.speed*0.6; R=tune.speed*0.6; }
    } else if(tuneBehaviour==="wall"){
      var side = s.distL<900 ? s.distL : (s.distR<900 ? s.distR : s.distFwd);
      var sign = s.distL<900 ? 1 : -1;
      var e = sign*(side-tune.target)/40;
      if(s.distFwd<24) wallTurn=1; else if(s.distFwd>WALL_CLEAR) wallTurn=0;
      if(wallTurn) e = -sign*1.4;
      L=clamp(tune.speed-e*tune.gain,-1,1);
      R=clamp(tune.speed+e*tune.gain,-1,1);
    } else {
      var rb=world.rivalBot;
      if(rb){
        var ang=Math.atan2(rb.y-r.y, rb.x-r.x)-r.th;
        while(ang>Math.PI)ang-=TAU; while(ang<-Math.PI)ang+=TAU;
        var near=Math.hypot(rb.x-r.x,rb.y-r.y)<26?0.6:1;
        L=clamp(tune.speed+ang*tune.gain*near,-1,1);
        R=clamp(tune.speed-ang*tune.gain*near,-1,1);
      } else { L=tune.speed; R=tune.speed; }
    }
  }
  var cmd={};
  var ws=r.wheels;
  for(var k=0;k<ws.length;k++) cmd[ws[k].id] = ws[k].x<0 ? L : R;
  lastCmd=cmd;
  return cmd;
}

var LIMITS={ line:60, maze:120, sumo:60, free:0 };
var liveT=0;
var running=false, view="build", runT=0, result=null, trail=[], telem=null;
function startRun(){
  closeReplay(true);
  world=makeWorld(el("challenge").value);
  buildMask();
  rebuild();
  robot.reset(world.start.x, world.start.y, world.start.th);
  if(world.rival){
    world.rivalBot=new Robot({ parts:[
      { id:"rl", type:"wheel", x:-7, y:0, angle:0, mass:0.09, maxSpeed:38, maxForce:5.2, reversed:false },
      { id:"rr", type:"wheel", x:7, y:0, angle:0, mass:0.09, maxSpeed:38, maxForce:5.2, reversed:false },
      { id:"rc", type:"caster", x:0, y:-8, mass:0.03 }], chassis:{w:16,h:20}, x:0, y:26, th:-Math.PI/2 });
    world.rivalBot.noPower=true;
  } else world.rivalBot=null;
  for(var ob2=0;ob2<obstacles.length;ob2++){
    var O=obstacles[ob2];
    if(O.hx===undefined){ O.hx=O.x; O.hy=O.y; }
    O.x=O.hx; O.y=O.hy;
  }
  resetBattery();
  runT=0; result=null; trail=[]; running=true; rec=[]; recT=0; wallTurn=0; beginCapture();
  for(var rp2=0;rp2<robot.parts.length;rp2++){
    var pp2=robot.parts[rp2];
    if(pp2.type==="us"){ pp2.next=0; pp2.hold=200; }
    if(pp2.type==="wheel") pp2.ticks=0;
    if(pp2.type==="servo") pp2.pos=0;
  }
  telem={ maxSpeed:0, sawLine:false, sensorMiss:0, samples:0 };
  setView("run");
  el("report").hidden=true;
  el("btnRun").textContent="Stop";
  setStatus("Running");
}
function stopRun(finish){
  if(!running) return;
  running=false;
  el("btnRun").textContent="Run";
  if(el("live")) el("live").hidden=true;
  if(!result) result={ ok:false, why:"You stopped the run." };
  lessonAfterRun();
  recordRun();
  showReport();
}
function setStatus(t,cls){
  var s=el("status"); s.textContent=t; s.className="status"+(cls?" "+cls:"");
}
function tick(dt){
  if(!running) return;
  runT+=dt;
  var sv=robot.parts.filter(function(q){return q.type==="servo";});
  for(var q1=0;q1<sv.length;q1++) if(sv[q1].sweep) sv[q1].pos=1.0*Math.sin(runT*1.7);
  var s=readSensors(robot);
  if(s.lineAny) telem.sawLine=true;
  telem.samples++;
  var cmd=control(robot,s);
  robot.step(dt,cmd,world);
  recT-=dt;
  if(recT<=0){ recT+=0.1; if(rec.length<6000){ rec.push(recRow(s)); capture(); ghostStep(); } }
  for(var q2=0;q2<robot.wheels.length;q2++){
    var wq=robot.wheels[q2];
    if(wq.motor==="enc") wq.ticks=(wq.ticks||0)+Math.abs(wq._vf||0)*dt/(TAU*3.5)*360;
  }
  liveT-=dt;
  if(liveT<=0){ liveT=0.1; drawLive(s); }
  var sp=Math.hypot(robot.vx,robot.vy);
  if(sp>telem.maxSpeed) telem.maxSpeed=sp;
  if(trail.length===0||Math.hypot(robot.x-trail[trail.length-1][0],robot.y-trail[trail.length-1][1])>1.5){
    trail.push([robot.x,robot.y]);
    if(trail.length>900) trail.shift();
  }
  if(world.rivalBot){
    var rb=world.rivalBot;
    var ang=Math.atan2(robot.y-rb.y,robot.x-rb.x)-rb.th;
    while(ang>Math.PI)ang-=TAU; while(ang<-Math.PI)ang+=TAU;
    rb.step(dt,{ rl:clamp(0.75+ang*1.2,-1,1), rr:clamp(0.75-ang*1.2,-1,1) },world);
  }
  checkGoal(dt);
  el("telemetry").textContent = "t " + runT.toFixed(1) + "s   speed " + sp.toFixed(0) + " cm/s" +
    (s.dist<120 ? "   wall " + s.dist.toFixed(0) + " cm" : "") + ghostNote();
  if(lesson&&lesson.runFor&&running&&runT>=lesson.runFor&&world.kind===lesson.challenge) lessonRunEnd();
  var lim=LIMITS[world.kind]||0;
  if(lim && runT>lim && running){
    result={ ok:false, why: world.kind==="sumo" ? "Time up. Neither robot shifted the other."
             : "Time up after "+lim+" seconds." };
    stopRun();
  }
}
function tractive(r,nx,ny){

  var f=Math.cos(r.th)*nx+Math.sin(r.th)*ny;
  if(f<=0) return 0;
  var tot=0;
  for(var i=0;i<r.wheels.length;i++){
    var N=r.loads[r.supports.indexOf(r.wheels[i])]||0;
    var vf2=r.noPower?1:clamp(batt.v/PACK.nominal,0.3,1.05);
    tot+=Math.min(r.wheels[i].maxForce*vf2, (r._mu0||0.85)*N);
  }
  return tot*f;
}
function checkGoal(dt){
  var k=world.kind;
  if(k==="line"){
    var cps=world.checkpoints, all=true;
    for(var i=0;i<cps.length;i++){
      if(!cps[i].hit && Math.hypot(robot.x-cps[i].x,robot.y-cps[i].y)<14) cps[i].hit=true;
      if(!cps[i].hit) all=false;
    }
    if(all){ result={ ok:true, why:"Lap complete in "+runT.toFixed(1)+" seconds." }; stopRun(); }
  } else if(k==="maze"){
    if(Math.hypot(robot.x-world.goal.x,robot.y-world.goal.y)<world.goal.r){
      result={ ok:true, why:"Reached the exit in "+runT.toFixed(1)+" seconds." }; stopRun();
    }
  } else if(k==="sumo"){
    var rb=world.rivalBot;
    if(Math.hypot(robot.x,robot.y)>world.ring.r){ result={ ok:false, why:"You went out of the ring." }; stopRun(); }
    else if(rb&&Math.hypot(rb.x,rb.y)>world.ring.r){ result={ ok:true, why:"You pushed the rival out in "+runT.toFixed(1)+" seconds." }; stopRun(); }
    else if(rb){
      var d=Math.hypot(robot.x-rb.x,robot.y-rb.y);
      var touch=(Math.hypot(robot.chassis.w,robot.chassis.h)+Math.hypot(rb.chassis.w,rb.chassis.h))/2*0.94;
      if(d<touch&&d>0.001){
        var nx=(rb.x-robot.x)/d, ny=(rb.y-robot.y)/d, pen=touch-d;
        var m1=robot.mass, m2=rb.mass, tot=m1+m2;
        robot.x-=nx*pen*(m2/tot); robot.y-=ny*pen*(m2/tot);
        rb.x+=nx*pen*(m1/tot);   rb.y+=ny*pen*(m1/tot);
        var vrel=(rb.vx-robot.vx)*nx+(rb.vy-robot.vy)*ny;
        if(vrel<0){
          var j=-1.1*vrel/(1/m1+1/m2);
          robot.vx-=j*nx/m1; robot.vy-=j*ny/m1;
          rb.vx+=j*nx/m2;   rb.vy+=j*ny/m2;
        }

        var net=(tractive(robot,nx,ny)-tractive(rb,-nx,-ny))/(m1+m2)*100*(dt||0);
        robot.vx+=nx*net; robot.vy+=ny*net;
        rb.vx+=nx*net;    rb.vy+=ny*net;
      }
    }
  }
}

function bar(v,col){

  h+='<tr class="sub"><td>draw</td><td colspan="2">'+batt.i.toFixed(2)+' A, '+Math.round(batt.soc*100)+'% of '+batt.cap+' mAh</td></tr>';
  var ws=robot.wheels.slice().sort(function(a,b){return a.x-b.x;});
  for(var i=0;i<ws.length;i++){
    var wl=ws[i], nm=(wl.x<0?"Left":"Right")+" "+(MOTORS[wl.motor]||MOTORS.dc).label;
    var cmd=lastCmd[wl.id]||0, spd=wl._vf||0;

    h+='<tr><td>'+nm+'</td><td>'+bar(Math.abs(cmd),"#FFC400")+'</td><td>'+(spd).toFixed(0)+' cm/s</td></tr>';
    h+='<tr'+(hard?' class="warn"':' class="sub"')+'><td>load</td><td>'+bar(wl._load||0,hard?"#FF6B70":"#C9A227")+
       '</td><td>'+(wl._amps||0).toFixed(2)+' A'+(hard?" pushing":"")+'</td></tr>';
    if(wl.motor==="enc") h+='<tr class="sub"><td>encoder</td><td colspan="2">'+Math.round(wl.ticks||0)+' ticks, '+((wl.ticks||0)/360*TAU*3.5/100).toFixed(2)+' m</td></tr>';

function diagnose(){
  var out=[], r=robot, w=r.wheels, k=world?world.kind:"free";
  var lines=r.parts.filter(function(p){return p.type==="line";});
  var dist=r.parts.filter(function(p){return p.type==="ir"||p.type==="us";});
  if(w.length===0) out.push("<b>Nothing drives it.</b> Fit at least two driven wheels.");
  else if(w.length===1) out.push("<b>Only one driven wheel.</b> With one wheel pushing, it can only turn in circles.");
  var left=w.filter(function(p){return p.x<0;}), right=w.filter(function(p){return p.x>=0;});
  if(w.length>=2&&(left.length===0||right.length===0))
    out.push("<b>Both wheels are on the same side.</b> Put one each side of the centre line so it can steer.");
  var revs=w.filter(function(p){return p.reversed;});
  if(revs.length===1&&w.length===2)
    out.push("<b>One wheel is wired backwards.</b> That is why it spins on the spot instead of driving.");
  var stab=r.stability();
  if(r.supports.length<3) out.push("<b>Only "+r.supports.length+" ground contact"+(r.supports.length===1?"":"s")+
    ".</b> The chassis rocks and scrapes. Three spread-out contacts hold it steady.");
  else if(stab<1) out.push("<b>The weight sits outside the triangle your contacts make.</b> A corner of the chassis is dragging along the floor. Move the battery back over the wheels, or add a caster at the front.");
  if(r.runTime>0.5){
    var slipPct=100*r.slipTime/r.runTime/Math.max(1,w.length);
    if(slipPct>18) out.push("<b>The wheels slipped for "+slipPct.toFixed(0)+"% of the run.</b> Move the battery pack over the driven wheels for grip.");
    if(r.dragTime/r.runTime>0.15) out.push("<b>The chassis scraped for "+(100*r.dragTime/r.runTime).toFixed(0)+"% of the run.</b>");
  }
  if(k==="line"){
    if(!lines.length) out.push("<b>No line sensor fitted.</b> The robot cannot see the track at all.");
    else if(lines.length===1) out.push("<b>Only one line sensor.</b> With one eye it can tell light from dark, but not which way to turn. Two, one each side, works far better.");
    else {
      var lft=lines.some(function(p){return p.x<-0.5;}), rgt=lines.some(function(p){return p.x>0.5;});
      if(!lft||!rgt) out.push("<b>Both line sensors are on the same side.</b> Straddle the line with one on each side.");
      var spread=Math.max.apply(null,lines.map(function(p){return p.x;}))-Math.min.apply(null,lines.map(function(p){return p.x;}));
      if(lft&&rgt&&spread>9) out.push("<b>The line sensors are "+spread.toFixed(0)+" cm apart.</b> The track is 3 cm wide, so they both miss it between corrections.");
    }
    if(lines.length&&telem&&telem.samples>20&&!telem.sawLine)
      out.push("<b>The sensors never once saw the line.</b> Check where they sit, and that the robot starts on the track.");
    var ahead=lines.length?Math.max.apply(null,lines.map(function(p){return p.y;})):0;
    if(ahead>13) out.push("<b>The line sensors reach "+ahead.toFixed(0)+" cm ahead of the wheels.</b> It reacts early and cuts corners.");
  }
  if(w.length>=2){
    var axle=0;
    for(var q=0;q<w.length;q++) axle+=w[q].y;
    axle/=w.length;
    var lean=r.comy-axle;
    if(lean<-3.5) out.push("<b>The weight sits "+(-lean).toFixed(0)+" cm behind the driven wheels.</b> Less of it presses down on them, so they have less grip.");
    else if(lean>4.5) out.push("<b>The weight sits "+lean.toFixed(0)+" cm ahead of the driven wheels.</b> Move the battery back over them for grip.");
  }
  if(k==="line"&&mode==="tune"&&tuneBehaviour==="line"&&result&&!result.ok&&tune.gain<0.5&&tune.speed>0.8)
    out.push("<b>It is too fast for such a gentle turn.</b> In the curves it cannot steer back onto the line. Raise the Turn setting, or slow down.");
  if(k==="maze"&&!dist.length) out.push("<b>No distance sensor fitted.</b> In a maze it is driving blind.");
  else if(k==="maze"&&mode==="tune"&&tuneBehaviour==="wall"&&!dist.some(function(p){ return (p.angle||0)>0.5&&(p.angle||0)<1.6; }))
    out.push("<b>Nothing looks at the left wall.</b> Auto mode hugs the wall on its left, so aim a distance sensor about 60 degrees to the left.");
  if(k==="sumo"&&r.mass<2.9) out.push("<b>Your robot is light ("+r.mass.toFixed(1)+" kg).</b> Traction grows with weight, so add a battery pack over the driven wheels and try again.");
  if(k==="sumo"&&result&&!result.ok&&w.length&&w.every(function(p){ return p.motor!=="step"; }))
    out.push("<b>Weight only helps up to a point.</b> A DC motor pushes at most 6.5 N however heavy the robot is. A stepper motor pushes 9.2 N, so fit steppers once the grip is there.");
  if(r.runTime>1){
    if(batt.minV<6.6) out.push("<b>The battery sagged to "+batt.minV.toFixed(1)+" V under load.</b> A small pack loses speed and power when the motors pull hard. Fit a heavier battery.");
    if((r.stallTime||0)>2.5) out.push("<b>The motors spent "+(r.stallTime||0).toFixed(0)+"s near stall, peaking at "+batt.peakI.toFixed(1)+" A.</b> That is what pushing into something costs, and it empties the pack fast.");
    if(batt.soc<0.15) out.push("<b>The battery is down to "+Math.round(batt.soc*100)+"%.</b> It will not finish another run like that.");
  }
  if(r.bumpCount>6) out.push("<b>It hit something "+r.bumpCount+" times.</b> Try a slower speed or a gentler turn.");
  if(!out.length) out.push("Nothing obviously wrong with this build. Try a tighter line or a faster speed.");
  return out.slice(0,4);
}

function exportBuild(){
  var parts=build.parts.map(function(p){
    var o={};

    return o;
  });
  return JSON.stringify({ app:"bench", v:1, parts:parts, challenge:el("challenge").value, mode:mode,
    behaviour:tuneBehaviour, tune:{ speed:tune.speed, gain:tune.gain, target:tune.target }, rules:rules }, null, 1);

function importBuild(text){
  var d;
  try{ d=JSON.parse(text); }catch(e){ return "That is not valid build code."; }
  if(!d||d.app!=="bench"||!Array.isArray(d.parts)) return "This code did not come from Bench.";
  if(d.parts.length>24) return "That build has too many parts. The limit is 24.";
  var parts=[], nid=1, i;
  for(i=0;i<d.parts.length;i++){
    var sp=d.parts[i];
    if(!sp||typeof sp.kind!=="string"||!CATALOG.hasOwnProperty(sp.kind)) return "Part "+(i+1)+" is not a Bench part.";
    var p=CATALOG[sp.kind].make();
    p.kind=sp.kind; p.id=sp.kind+(nid++);
    if(isFinite(+sp.x)) p.x=+sp.x;
    if(isFinite(+sp.y)) p.y=+sp.y;
    if(p.angle!==undefined&&p.type!=="wheel"&&isFinite(+sp.angle)) p.angle=clamp(+sp.angle,-Math.PI,Math.PI);
    if(p.type==="wheel"){ p.motor=MOTORS.hasOwnProperty(sp.motor)?sp.motor:"dc"; if(GEARS.indexOf(+sp.gear)>=0&&+sp.gear!==1) p.gear=+sp.gear; applyMotor(p); p.reversed=sp.reversed===true; }
    if(p.type==="servo") p.sweep=sp.sweep!==false;
    if(p.type==="ballast"&&isFinite(+sp.mass)) p.mass=clamp(+sp.mass,0.1,1.4);
    clampPart(p);
    parts.push(p);
  }
  var ch=d.challenge;
  if(["line","maze","sumo","free","hill","drag","course","deliver"].indexOf(ch)>=0){ el("challenge").value=ch; autoConfigure(ch); }
  if(d.tune&&typeof d.tune==="object"){
    tune.speed=clamp(+d.tune.speed||tune.speed,0.1,1);
    tune.gain=clamp(+d.tune.gain||tune.gain,0.1,4);
    tune.target=clamp(+d.tune.target||tune.target,8,60);
  }
  if(["line","wall","charge","straight","deliver"].indexOf(d.behaviour)>=0) tuneBehaviour=d.behaviour;
  if(["tune","rules","drive"].indexOf(d.mode)>=0) mode=d.mode;
  if(Array.isArray(d.rules)&&d.rules.length){
    var rr=[], c, a, j;
    for(j=0;j<d.rules.length&&j<12;j++){
      var q=d.rules[j]||{}, okc=false, oka=false;
      for(c=0;c<CONDS.length;c++) if(CONDS[c][0]===q.cond) okc=true;
      for(a=0;a<ACTS.length;a++) if(ACTS[a][0]===q.act) oka=true;
      if(okc&&oka) rr.push({ cond:q.cond, op:q.op==="<"?"<":">", val:isFinite(+q.val)?+q.val:0, act:q.act });
    }
    if(rr.length){ rules.length=0; for(j=0;j<rr.length;j++) rules.push(rr[j]); }
  }
  if(running) stopRun();
  build.parts=parts; build.nextId=nid; selected=null;
  obstacles.length=0;
  world=makeWorld(el("challenge").value); buildMask();
  rebuild();
  robot.reset(world.start.x,world.start.y,world.start.th);
  trail=[]; el("report").hidden=true; setStatus("Ready"); el("telemetry").textContent="";
  return "";
}

function saveText(name,text,label,fromSheet){
  function fallback(){
    if(fromSheet){ el("shMsg").textContent="Saving a file is not available here. Use Copy instead."; return; }
    openSheet("copy",label,"Saving a file is not available here. Copy this text into a file named "+name+".",text,null);
  }
  var c=window.claude;
  if(c&&typeof c.use==="function"){
    var pr;
    try{ pr=c.use("downloads"); }catch(e1){ fallback(); return; }
    Promise.resolve(pr).then(function(d){
      if(!d){ fallback(); return; }
      return d.save({ filename:name, data:text }).then(function(){ toast("Saved "+name); },
        function(err){ if(err&&err.code==="declined") return; fallback(); });
    }).catch(function(){ fallback(); });
    return;
  }
  try{
    var blob=new Blob([text],{ type:"text/plain" }), u=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(u); },4000);
    toast("Saved "+name);
  }catch(e2){ fallback(); }
}

function newTrace(){

  T.t.push(runT); T.x.push(robot.x); T.y.push(robot.y); T.th.push(robot.th);

function packTrace(T){

    o.push(Math.round(T.t[i]*100),Math.round(T.x[i]*10),Math.round(T.y[i]*10),Math.round(T.th[i]*1000),
           Math.round(T.v[i]*10),Math.round(T.bv[i]*100),Math.round(T.ba[i]*100),Math.round(T.ld[i]*10));
    if(T.sumo) o.push(Math.round(T.rx[i]*10),Math.round(T.ry[i]*10),Math.round(T.rth[i]*1000));

}
function unpackTrace(e,kind){

  for(i=0;i<n;i++){

    T.t.push(p[b]/100); T.x.push(p[b+1]/10); T.y.push(p[b+2]/10); T.th.push(p[b+3]/1000);
    T.v.push(p[b+4]/10); T.bv.push(p[b+5]/100); T.ba.push(p[b+6]/100); T.ld.push(p[b+7]/10);
    if(e.sumo){ T.rx.push(p[b+8]/10); T.ry.push(p[b+9]/10); T.rth.push(p[b+10]/1000); }
    else { T.rx.push(NaN); T.ry.push(NaN); T.rth.push(NaN); }

function lerp(a,b,f){ return a+(b-a)*f; }
function lerpAng(a,b,f){ return a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*f; }
function seekT(T,t){

}
function poseAt(T,t){

  return { i:i, x:lerp(T.x[i],T.x[j],f), y:lerp(T.y[i],T.y[j],f), th:lerpAng(T.th[i],T.th[j],f),
           rx:lerp(T.rx[i],T.rx[j],f), ry:lerp(T.ry[i],T.ry[j],f), rth:lerpAng(T.rth[i],T.rth[j],f) };
}

}
function saveBests(){
  var keeps=[3,1,0], i;
  for(i=0;i<keeps.length;i++){
    var o={ v:1 };
    for(var k in BESTK) o[k]=plainList(bests[k],keeps[i]);

  }

}
function loadBests(){
  ghostOn=lsGet(GHOST_KEY)!=="0";
  graphsOn=lsGet(GRAPH_KEY)!=="0";
  var raw=lsGet(BEST_KEY), d;
  if(!raw) return;
  try{ d=JSON.parse(raw); }catch(e){ return; }
  if(!d||typeof d!=="object") return;
  for(var k in BESTK){
    var src=Array.isArray(d[k])?d[k]:[], out=[], i;
    for(i=0;i<src.length&&out.length<5;i++){
      var e=src[i];
      if(!e||!isFinite(+e.t)||+e.t<=0||!e.b||typeof e.b!=="object") continue;
      var o={ t:+e.t, d:String(e.d||"").slice(0,10), sum:String(e.sum||"").slice(0,60),
              mode:String(e.mode||"").slice(0,12), b:e.b, sumo:e.sumo===true, obs:e.obs===true };
      var st=o.sumo?11:8;
      if(Array.isArray(e.p)&&e.p.length>=st*2&&e.p.length<=st*6000&&e.p.length%st===0&&
         e.p.every(function(v){ return typeof v==="number"&&isFinite(v); })) o.p=e.p;
      out.push(o);
    }
    out.sort(function(a,b){ return a.t-b.t; });
    bests[k]=out;
  }
}

function ghostEntry(kind){

  var pk=ghostPick[kind];

  return null;
}
function ghostTrace(){
  if(!ghostOn||!world||!BESTK[world.kind]) return null;
  var e=ghostEntry(world.kind);

  return e.tr.n>1?e.tr:null;
}
function ghostStep(){
  if(!running||world.kind==="sumo") return;
  var G=ghostTrace();

  var lo=Math.max(0,gapInfo.gi-30), hi=Math.min(G.n-1,gapInfo.gi+120), best=1e9, bi=-1, i;
  for(i=lo;i<=hi;i++){
    var dx=G.x[i]-robot.x, dy=G.y[i]-robot.y, dd=dx*dx+dy*dy;
    if(dd<best){ best=dd; bi=i; }
  }
  if(bi>=0&&best<225){ gapInfo.gi=bi; gapInfo.gap=runT-G.t[bi]; }
}
function ghostNote(){
  var G=ghostTrace();

function recordRun(){
  if(!world||!robot||!curT) return;
  var T=curT, i;
  if(T.n===0||T.t[T.n-1]<runT-0.02) capture();
  T.kind=world.kind; T.time=runT; T.ok=!!(result&&result.ok); T.sumo=!!world.rivalBot;
  T.bs=exportBuild();
  lastRun=T.n>1?T:null;
  graphKey="";
  if(lastRun&&T.ok&&BESTK[T.kind]&&!suppressRec){
    var kind=T.kind, list=bests[kind], t=Math.round(runT*100)/100;
    var b=JSON.parse(T.bs), key=JSON.stringify(b), prev=list.length?list[0].t:null, dup=-1, done=false;
    for(i=0;i<list.length;i++) if(JSON.stringify(list[i].b)===key){ dup=i; break; }
    if(dup>=0){
      if(t<list[dup].t-0.004) list.splice(dup,1);
      else { result.why+=" Same build as your "+list[dup].t.toFixed(2)+" s record."; T.rank=dup+1; done=true; }
    }
    if(!done){
      var pos=0;
      while(pos<list.length&&list[pos].t<=t) pos++;
      if(pos>=5){ result.why+=" Not quick enough for the top 5 here (5th is "+list[4].t.toFixed(2)+" s)."; done=true; }
      else {
        var e={ t:t, d:today(), sum:build.parts.length+" parts, "+robot.mass.toFixed(2)+" kg", mode:MODEN[mode]||"Auto",
                b:b, p:packTrace(T), sumo:T.sumo, obs:obstacles.length>0 };
        list.splice(pos,0,e);
        if(list.length>5) list.length=5;
        for(i=3;i<list.length;i++) delete list[i].p;
        if(pos===0) ghostPick[kind]=null;
        T.rank=pos+1;
        result.why+= pos===0 ? (prev===null ? " First record on this track." : " New personal best, "+(prev-t).toFixed(2)+" s faster.")
                             : " Rank "+(pos+1)+" of "+list.length+" on this track.";
        saveBests();
      }
    }
  }
  if(view==="run") drawSide();
}

  robot.x=p.x; robot.y=p.y; robot.th=p.th; robot.vx=0; robot.vy=0;
  var rb=world.rivalBot;
  if(rb&&isFinite(p.rx)){ rb.x=p.rx; rb.y=p.ry; rb.th=p.rth; rb.vx=0; rb.vy=0; }
  var ob=T.ob&&T.ob[p.i];
  if(ob&&ob.length===obstacles.length*2) for(i=0;i<obstacles.length;i++){ obstacles[i].x=ob[i*2]; obstacles[i].y=ob[i*2+1]; }

  trail.push([p.x,p.y]);

function drawGraphs(){
  var box=el("graphs"), S=graphsOn?graphSource():null;
  if(!S||S.n<2){ if(!box.hidden){ box.hidden=true; el("stage").classList.remove("gon"); } graphKey=""; return; }
  if(box.hidden){ box.hidden=false; el("stage").classList.add("gon"); graphKey=""; }
  if(box.classList.contains("min")) return;
  var gc=el("gc"), r=gc.getBoundingClientRect(), w=Math.max(1,Math.round(r.width)), h=Math.max(1,Math.round(r.height));
  var G=ghostTrace();
  if(G===S||(rp.on&&G&&rp.tr===G)) G=null;
  var key=[S.n,S.time.toFixed(2),(S===curT?"c":(rp.on?"r"+rp.t.toFixed(2):"l")),w,h,G?G.time:0].join("|");
  if(key===graphKey) return;

  var dpr=Math.min(window.devicePixelRatio||1,2);
  if(gc.width!==Math.round(w*dpr)||gc.height!==Math.round(h*dpr)){ gc.width=Math.round(w*dpr); gc.height=Math.round(h*dpr); }
  var g=gc.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  var F=getComputedStyle(document.body).fontFamily;
  var rows=GROWS.slice(0,h>=150?4:(h>=100?3:2)), axisH=14, rowH=(h-axisH)/rows.length;
  var tEnd=Math.max(S.t[S.n-1],S===curT?10:4), t0=0, t1=tEnd;
  if(S===curT&&tEnd>30) t0=tEnd-30;
  function X(t){ return (t-t0)/(t1-t0)*w; }
  var idx=S.n-1;
  if(rp.on&&S===rp.tr) idx=seekT(S,rp.t);
  var ri, i, R;
  for(ri=0;ri<rows.length;ri++){
    R=rows[ri];
    var top=ri*rowH, py0=top+13, py1=top+rowH-3, mx=0, mn=0;
    for(i=0;i<S.n;i++) if(S.t[i]>=t0&&S[R.k][i]>mx) mx=S[R.k][i];
    if(G) for(i=0;i<G.n;i++) if(G.t[i]>=t0&&G.t[i]<=t1&&G[R.k][i]>mx) mx=G[R.k][i];
    if(R.k==="v") mx=Math.max(60,mx*1.1);
    else if(R.k==="ba") mx=Math.max(1.5,mx*1.15);
    else if(R.k==="ld") mx=100;
    else if(R.k==="bv"){ mn=5.8; mx=Math.max(8.5,mx); }
    g.strokeStyle="rgba(147,162,180,.18)"; g.lineWidth=1;
    g.beginPath(); g.moveTo(0,py1+0.5); g.lineTo(w,py1+0.5); g.stroke();
    var Y=function(v){ return py1-(clamp(v,mn,mx)-mn)/(mx-mn)*(py1-py0); };
    if(G){
      g.strokeStyle="rgba(233,238,246,.45)"; g.lineWidth=1; g.beginPath();
      var st=false;
      for(i=0;i<G.n;i++){
        if(G.t[i]<t0-1||G.t[i]>t1+1) continue;
        if(!st){ g.moveTo(X(G.t[i]),Y(G[R.k][i])); st=true; } else g.lineTo(X(G.t[i]),Y(G[R.k][i]));
      }
      g.stroke();
    }
    g.strokeStyle=R.col; g.lineWidth=1.6; g.beginPath();
    var first=true, lx=0;
    for(i=0;i<S.n;i++){
      if(S.t[i]<t0-1) continue;
      var px=X(S.t[i]), py=Y(S[R.k][i]);
      if(first){ g.moveTo(px,py); first=false; } else g.lineTo(px,py);
      lx=px;
    }
    g.stroke();
    g.lineTo(lx,py1); g.lineTo(X(Math.max(t0,S.t[0])),py1); g.closePath();
    g.globalAlpha=0.10; g.fillStyle=R.col; g.fill(); g.globalAlpha=1;
    g.font="500 10.5px "+F; g.textBaseline="alphabetic";
    g.fillStyle="rgba(147,162,180,.95)"; g.textAlign="left";
    g.fillText(R.label,2,top+10);
    g.fillStyle="rgba(233,238,246,.97)"; g.textAlign="right";
    var vtxt=S[R.k][idx].toFixed(R.d)+R.unit;
    if(G){
      var gp=poseAt(G,rp.on&&S===rp.tr?rp.t:S.t[idx]);
      vtxt+="   best "+G[R.k][gp.i].toFixed(R.d);
    }
    g.fillText(vtxt,w-2,top+10);
  }
  g.font="500 10px "+F; g.fillStyle="rgba(147,162,180,.9)"; g.textAlign="center";
  var step=(t1-t0)>40?10:5, tk;
  for(tk=Math.ceil(t0/step)*step;tk<=t1;tk+=step){
    var xx=clamp(X(tk),10,w-10);
    if(G&&xx>w-135) continue;
    g.fillText(tk+"s",xx,h-3);
  }
  if(G){ g.textAlign="right"; g.fillStyle="rgba(233,238,246,.7)"; g.fillText("white: best "+G.time.toFixed(2)+" s",w-2,h-3); }
  if(rp.on&&S===rp.tr){
    var cx=X(rp.t);
    g.strokeStyle="rgba(233,238,246,.65)"; g.lineWidth=1;
    g.beginPath(); g.moveTo(cx+0.5,0); g.lineTo(cx+0.5,h-axisH); g.stroke();
  }
}

function hash5(str){
  var h=5381, i;
  for(i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0;
  return ("00000"+(h>>>0).toString(16)).slice(-5).toUpperCase();
}
function studentName(){ return lsGet(STU_KEY)||""; }
function kindLabel(k){ return CATALOG[k].label.replace(" pack","").replace("Motor + ","").toLowerCase(); }

function parseAssignment(text){
  var d, k;
  try{ d=JSON.parse(text); }catch(e){ return { err:"That is not valid assignment code." }; }
  if(!d||d.app!=="bench"||d.kind!=="assignment") return { err:"This code is not a Bench assignment." };
  var a={ app:"bench", v:1, kind:"assignment" };
  a.title=String(d.title||"").trim().slice(0,80);
  if(!a.title) return { err:"The assignment needs a title." };
  a.text=String(d.text||"").slice(0,800);
  if(["line","maze","sumo","hill","drag","course","deliver"].indexOf(d.challenge)<0) return { err:"Pick one of the timed challenges." };
  a.challenge=d.challenge;
  a.allow=null;
  if(d.allow&&typeof d.allow==="object"){
    a.allow={};
    for(k in CATALOG){
      var n=d.allow.hasOwnProperty(k)?Math.floor(+d.allow[k]):0;
      a.allow[k]=isFinite(n)?clamp(n,0,24):0;
    }
  }
  a.maxParts=(isFinite(+d.maxParts)&&+d.maxParts>=1)?Math.min(24,Math.floor(+d.maxParts)):null;
  a.maxMass=(isFinite(+d.maxMass)&&+d.maxMass>0)?clamp(+d.maxMass,0.3,10):null;
  a.target=(isFinite(+d.target)&&+d.target>0)?clamp(+d.target,1,120):null;
  a.start=null;
  if(d.start!==null&&d.start!==undefined){
    if(typeof d.start!=="object"||d.start.app!=="bench"||!Array.isArray(d.start.parts)) return { err:"The starting build is not valid." };
    a.start=d.start;
  }
  return { a:a, id:hash5(JSON.stringify(a)) };
}

function assignChecks(a){
  var cnt={}, i, k, items=[], total=build.parts.length;
  for(i=0;i<build.parts.length;i++){ k=build.parts[i].kind; cnt[k]=(cnt[k]||0)+1; }
  if(a.allow){
    var bad=0, txt=[];
    for(k in a.allow){
      var n=cnt[k]||0, mx=a.allow[k];
      if(mx>0||n>0){ txt.push(kindLabel(k)+" "+n+"/"+mx); if(n>mx) bad++; }
    }
    items.push({ ok:bad===0, t:"Parts allowed: "+(txt.join(", ")||"none") });
  }
  if(a.maxParts!==null) items.push({ ok:total<=a.maxParts, t:"Total parts: "+total+", at most "+a.maxParts });
  if(a.maxMass!==null) items.push({ ok:robot.mass<=a.maxMass+1e-9, t:"Weight: "+robot.mass.toFixed(2)+" kg, at most "+a.maxMass.toFixed(2)+" kg" });
  var all=true;
  for(i=0;i<items.length;i++) if(!items[i].ok) all=false;
  return { items:items, ok:all };
}
function addBlocked(kind){
  if(!assign) return false;
  var n=0, i;
  for(i=0;i<build.parts.length;i++) if(build.parts[i].kind===kind) n++;
  if(assign.allow&&n>=assign.allow[kind]) return true;
  if(assign.maxParts!==null&&build.parts.length>=assign.maxParts) return true;
  return false;
}
function addPartGuarded(kind){
  if(addBlocked(kind)){ toast("This assignment does not allow another "+kindLabel(kind)+"."); return; }
  addPart(kind);
}

function fixedRun(){
  startRun();

  while(running&&n<8200){ tick(1/60); n++; }
  if(running){ result={ ok:false, why:"Time up." }; stopRun(); }
  return { ok:!!(result&&result.ok), time:runT, why:result?result.why:"" };
}
function buildSig(){ return normBuild(exportBuild()); }
function officialRun(){

function csvCell(v){
  var s=String(v===null||v===undefined?"":v);
  if(/^[=+\-@]/.test(s)) s="'"+s;
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function parseSubs(text){
  var t=text.trim(), out=[], i;
  if(!t) return out;
  try{
    var whole=JSON.parse(t);
    if(Array.isArray(whole)) return whole.slice(0,60);
    if(whole&&typeof whole==="object") return [whole];
  }catch(e){}
  var lines=t.split(/\n+/);
  for(i=0;i<lines.length&&out.length<60;i++){
    var ln=lines[i].trim();
    if(!ln) continue;
    try{ out.push(JSON.parse(ln)); }catch(e2){ out.push({ badline:i+1 }); }
  }
  return out;
}
function verifyOne(a,id,s){
  var row={ student:"", claimed:null, time:null, ok:false, cons:false, pass:false, note:"", parts:0, mass:0 };
  if(!s||s.badline){ row.student="(unreadable)"; row.note="Could not read this entry."; return row; }
  if(s.app!=="bench"||s.kind!=="submission"||!s.build||typeof s.build!=="object"){ row.student="(unreadable)"; row.note="Not a Bench submission."; return row; }
  row.student=String(s.student||"(no name)").slice(0,40);
  row.claimed=isFinite(+s.claimed)?+s.claimed:null;
  var b=s.build;
  b.challenge=a.challenge;
  var err=importBuild(JSON.stringify(b));
  if(err){ row.note=err; return row; }
  var ch=assignChecks(a);
  row.cons=ch.ok; row.parts=build.parts.length; row.mass=robot.mass;
  var notes=[];
  if(s.aid!==id) notes.push("Made for a different assignment.");
  if(!ch.ok){
    var bad=[];
    for(var i=0;i<ch.items.length;i++) if(!ch.items[i].ok) bad.push(ch.items[i].t);
    notes.push("Breaks the rules: "+bad.join("; ")+".");
  } else if(mode==="drive") notes.push("Manual mode cannot be checked.");
  else {
    el("challenge").value=a.challenge;
    var r=fixedRun();
    row.ok=r.ok; row.time=r.time;
    row.pass=r.ok&&(a.target===null||r.time<=a.target+1e-9);
    if(!r.ok) notes.push(r.why);
    else if(!row.pass) notes.push("Over the "+a.target+" s target.");

function verifyAll(){
  var msg=el("ckMsg");

  var pa=parseAssignment(el("ckAssign").value);
  if(pa.err){ msg.textContent=pa.err; return; }
  var subs=parseSubs(el("ckSubs").value);
  if(!subs.length){ msg.textContent="Paste at least one submission."; return; }
  cls.busy=true; cls.rows=null; cls.id=pa.id; cls.a=pa.a;
  el("ckRun").disabled=true; el("ckCsv").disabled=true; el("ckOut").innerHTML="";
  var saved={ b:exportBuild(), obs:obstacles.slice(), ch:el("challenge").value, v:view };
  var rows=[], i=0;
  suppressRec=true;
  function finish(){
    suppressRec=false;
    importBuild(saved.b);
    for(var q=0;q<saved.obs.length;q++) obstacles.push(saved.obs[q]);
    el("challenge").value=saved.ch;
    world=makeWorld(saved.ch); buildMask();
    robot.reset(world.start.x,world.start.y,world.start.th);

function rampH(R,x,y){

function hAtW(w,x,y){

  if(sf0.rr){
    var spd=Math.hypot(r.vx,r.vy);
    if(spd>0.01){ var dv=Math.min(spd,sf0.rr*G_CM*h); r.vx-=r.vx/spd*dv; r.vy-=r.vy/spd*dv; }
  }
  if(!w||!w.ramps||!w.ramps.length){ r._cs=1; r.pitch=0; r.roll=0; r.elev=0; return; }
  var e=0.6, gx=(hAtW(w,r.x+e,r.y)-hAtW(w,r.x-e,r.y))/(2*e), gy=(hAtW(w,r.x,r.y+e)-hAtW(w,r.x,r.y-e))/(2*e);
  var den=1+gx*gx+gy*gy;
  r._cs=1/Math.sqrt(den);
  r.vx-=G_CM*gx/den*h; r.vy-=G_CM*gy/den*h;
  r.elev=hAtW(w,r.x,r.y);
  var c=Math.cos(r.th), sn=Math.sin(r.th);
  r.pitch=gx*c+gy*sn; r.roll=gx*sn-gy*c;
}

  var sf=surfAt(w,r.x+rx*100,r.y+ry*100);

    T.tp=gx*Math.cos(th)+gy*Math.sin(th);

  }

function wallBar(x0,y0,x1,y1){ return { x0:Math.min(x0,x1), y0:Math.min(y0,y1), x1:Math.max(x0,x1), y1:Math.max(y0,y1) }; }

function mkHill(){
  var w={ kind:"hill", walls:border(6).concat(corridor(26)), track:null, goal:{ x:98, y:0, r:26 }, checkpoints:null, rival:null,
          start:{ x:-104, y:0, th:0 }, obstacles:obstacles };

function mkDrag(){
  var w={ kind:"drag", walls:border(6).concat(corridor(26)), track:null, goal:null, checkpoints:null, rival:null,
          start:{ x:-104, y:0, th:0 }, obstacles:obstacles, finish:100 };

  w.marks=[{ t:"finish", x:100, y0:-26, y1:26 }, { t:"lane", y:-16 }, { t:"lane", y:16 }];

function mkCourse(){
  var pts=[], i, a=98, b=56;
  for(i=0;i<=120;i++){
    var t=i/120*TAU, c=Math.cos(t), s=Math.sin(t);
    pts.push([a*(c<0?-1:1)*Math.pow(Math.abs(c),0.5), b*(s<0?-1:1)*Math.pow(Math.abs(s),0.5)]);
  }
  var w={ kind:"course", walls:border(6), track:pts, goal:null, rival:null, obstacles:obstacles };
  w.checkpoints=[0,30,60,90].map(function(k){ return { x:pts[k][0], y:pts[k][1], hit:false }; });
  w.start={ x:pts[0][0], y:pts[0][1], th:Math.atan2(pts[3][1]-pts[0][1], pts[3][0]-pts[0][0]) };
  w.ramps=[{ x0:-35, x1:35, y0:38, y1:74, ax:"x", sg:1, s0:-35, len:70, rise:4.5, prof:"hump" }];
  w.zones=[{ x0:84, x1:125, y0:-80, y1:80, f:"carpet" }, { x0:-125, x1:-84, y0:-80, y1:80, f:"tile" }];
  return w;
}
function mkDeliver(){
  var pts=[], i, N=100;

    pts.push([-100+195*u, -45+85*sm+11*Math.sin(u*TAU)]);

  var w={ kind:"deliver", walls:border(6), track:pts, open:true, goal:null, checkpoints:null, rival:null };
  w.start={ x:pts[0][0], y:pts[0][1], th:Math.atan2(pts[3][1]-pts[0][1], pts[3][0]-pts[0][0]) };

function surfQuads(z){
  var F=FLOORS[z.f];
  if(!F||!F.col) return;
  var sz=z.f==="tile"?10:7, ix, iz, n=0;
  for(ix=Math.floor(z.x0/sz);ix*sz<z.x1;ix++){
    for(iz=Math.floor(z.y0/sz);iz*sz<z.y1;iz++){
      var xa=Math.max(z.x0,ix*sz), xb=Math.min(z.x1,(ix+1)*sz), ya=Math.max(z.y0,iz*sz), yb=Math.min(z.y1,(iz+1)*sz);
      if(xb<=xa||yb<=ya) continue;
      var ci=z.f==="tile"?((ix+iz)&1):(ix&1);
      pushFace([[xa,0.04,-ya],[xb,0.04,-ya],[xb,0.04,-yb],[xa,0.04,-yb]],F.col[ci],true);
    }

}
function drawSurfaces(){

  if(base&&base.col) zs.unshift({ x0:-ARENA.w/2, x1:ARENA.w/2, y0:-ARENA.h/2, y1:ARENA.h/2, f:w.floor });
  for(i=0;i<zs.length;i++) surfQuads(zs[i]);
  var ms=w.marks||[];
  for(i=0;i<ms.length;i++){
    var m=ms[i];
    if(m.t==="drop"){
      discW(m.x,-m.y,m.r,0.08,[18,20,26]);
      discW(m.x,-m.y,m.r+1.4,0.06,[255,196,0],0.55);
    } else if(m.t==="lane"){
      pushFace([[-112,0.06,-(m.y-0.5)],[112,0.06,-(m.y-0.5)],[112,0.06,-(m.y+0.5)],[-112,0.06,-(m.y+0.5)]],[255,196,0],true);
    } else if(m.t==="finish"){

function axisCuts(R){
  var a=R.ax==="x"?R.x0:R.y0, b=R.ax==="x"?R.x1:R.y1;
  var r0=Math.min(R.s0,R.s0+R.sg*R.len), r1=Math.max(R.s0,R.s0+R.sg*R.len);
  var cuts=[a], v;
  for(v=Math.max(a,r0);v<Math.min(b,r1);v+=3) cuts.push(v);
  cuts.push(Math.min(b,r1)); cuts.push(b);
  cuts.sort(function(p,q){ return p-q; });
  var out=[cuts[0]];
  for(var i=1;i<cuts.length;i++) if(cuts[i]-out[out.length-1]>0.01) out.push(cuts[i]);
  return out;
}
function pushRamps(){
  if(!hasRamps()) return;
  var w=world, ri, i, j, side=[56,64,80];
  for(ri=0;ri<w.ramps.length;ri++){
    var R=w.ramps[ri], cuts=axisCuts(R);
    var l0=R.ax==="x"?R.y0:R.x0, l1=R.ax==="x"?R.y1:R.x1;
    var nl=Math.max(1,Math.ceil((l1-l0)/9)), dl=(l1-l0)/nl;
    function P(u,l,h){ return R.ax==="x"?[u,h,-l]:[l,h,-u]; }
    function H(u,l){ return R.ax==="x"?rampH(R,u,l):rampH(R,l,u); }
    for(i=0;i+1<cuts.length;i++){
      var ua=cuts[i], ub=cuts[i+1], shade=(i&1)?0:5;
      var col=[84+shade,94+shade,112+shade];
      var mid=(ua+ub)/2, hm=H(mid,(l0+l1)/2);
      if(hm>0.05&&(((i>>1)&1))) col=[col[0]+20,col[1]+18,col[2]-14];
      for(j=0;j<nl;j++){
        var la=l0+j*dl, lb=la+dl;
        pushFace([P(ua,la,H(ua,la)),P(ub,la,H(ub,la)),P(ub,lb,H(ub,lb)),P(ua,lb,H(ua,lb))],col,true);
      }
      pushFace([P(ua,l0,0),P(ub,l0,0),P(ub,l0,H(ub,l0)),P(ua,l0,H(ua,l0))],side,true);
      pushFace([P(ua,l1,0),P(ub,l1,0),P(ub,l1,H(ub,l1)),P(ua,l1,H(ua,l1))],side,true);
    }
    var last=cuts[cuts.length-1];
    if(H(last,(l0+l1)/2)>0.05) pushFace([P(last,l0,0),P(last,l1,0),P(last,l1,H(last,l1)),P(last,l0,H(last,l0))],side,true);
  }
  var n0=FACES.length, k;
  if(w.track){
    var nseg=w.track.length-(w.open?1:0);
    for(i=0;i<nseg;i++){
      var a=w.track[i], b=w.track[(i+1)%w.track.length];
      var ax=a[0], az=-a[1], bx=b[0], bz=-b[1], ha=hAt(a[0],a[1])+0.15, hb=hAt(b[0],b[1])+0.15;
      var dx=bx-ax, dz=bz-az, L=Math.hypot(dx,dz)||1, nx=-dz/L*1.7, nz=dx/L*1.7;
      pushFace([[ax+nx,ha,az+nz],[bx+nx,hb,bz+nz],[bx-nx,hb,bz-nz],[ax-nx,ha,az-nz]],[12,14,18],true);
    }
  }
  for(i=0;w.checkpoints&&i<w.checkpoints.length;i++){
    var c=w.checkpoints[i];
    discW(c.x,-c.y,7,hAt(c.x,c.y)+0.25,c.hit?[90,228,155]:[255,196,0],c.hit?0.5:0.22);
  }
  if(w.goal) discW(w.goal.x,-w.goal.y,w.goal.r,hAt(w.goal.x,w.goal.y)+0.2,[90,228,155],0.4);
  for(k=n0;k<FACES.length;k++) FACES[k].d-=6;
}
function drawWallBox(cx,cy,sx,sy){

  var alongX=sx>=sy, len=alongX?sx:sy, n=Math.max(1,Math.ceil(len/5)), seg=len/n, i;
  for(i=0;i<n;i++){
    var px=alongX?(cx-sx/2+seg*(i+0.5)):cx, py=alongX?cy:(cy-sy/2+seg*(i+0.5));
    var hh=hAt(px,py);

function firstPart(r,type){

  return null;

function cargoNear(r){
  var g=gripperPart(r), pl=world&&world.payload;
