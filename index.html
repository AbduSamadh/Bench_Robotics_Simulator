  var J=jawPoint(r,g);
  return Math.hypot(pl.x-J[0],pl.y-J[1])<15;
}
function gripStep(r,dt){
  var g=gripperPart(r);
  if(!g) return;
  var tgt=g.want?1:0, d=tgt-(g.pos||0), st=dt*4;
  g.pos=Math.abs(d)<st?tgt:(g.pos||0)+(d>0?st:-st);
  var pl=world&&world.payload;
  if(!pl) return;
  var J=jawPoint(r,g);
  if(pl.held){
    if(!g.want){ pl.held=false; pl.lift=0; r.mass=Math.max(0.1,r.mass-pl.m); r.loads=r.supportLoads(); }
    else { pl.x=J[0]; pl.y=J[1]; pl.lift=5.5; }
  } else if(g.want&&Math.hypot(pl.x-J[0],pl.y-J[1])<9.5){
    pl.held=true; pl.lift=5.5; r.mass+=pl.m; r.loads=r.supportLoads(); polish.grabs=(polish.grabs||0)+1;
  }
}
function gyroBias(g){

}
var _rs0=readSensors;
readSensors=function(r){

    var t=runT;
    s.hdg=(r.th-(r._th0||0))+gyroBias(g)*t+0.004*Math.sin(t*53.7+1.3)+0.003*Math.sin(t*17.9);
    s.yawRate=r.w+0.01*Math.sin(t*41.0);

  s.hasOdo=en.length>0;
  s.odo=0;

var _cv0=condValue;
condValue=function(s,c){

function ruleFired(s){

function ruleDefaults(r){

  else if(c.indexOf("dist")===0){ if([10,15,20,25,30,40,50].indexOf(+r.val)<0){ r.val=20; r.op="<"; } }

function zeroRefs(r,s){ r._h0=s.hdg; r._o0=s.odo; r._hi=0; }

function pairToCmd(r,L,R){

function autoDeliver(r,s){
  var err=s.lineRight-s.lineLeft, L, R, sp=tune.speed;
  if(!s.holding&&s.cargoNear) setGrip(r,1);
  if(r._done) return pairToCmd(r,0,0);
  if(s.holding&&s.lineLeft>0.85&&s.lineRight>0.85){
    if(r._dk===undefined) r._dk=runT;
    if(runT-r._dk>0.12){ setGrip(r,0); r._done=true; return pairToCmd(r,0,0); }
  } else r._dk=undefined;
  L=clamp(sp+err*tune.gain,-1,1); R=clamp(sp-err*tune.gain,-1,1);
  if(s.lineLeft<0.15&&s.lineRight<0.15){ L=sp*0.6; R=sp*0.6; }

var _ctl0=control;
control=function(r,s){

    act=ruleFired(s);

  }
  cmd=_ctl0(r,s);
  if(mode==="rules"&&act==="hold"){

var _sr0=startRun;

  if(world.payload){ world.payload.held=false; world.payload.lift=0; world.payload.x=world.payload.hx; world.payload.y=world.payload.hy; }

var _tick0=tick;

  var i, q;
  for(i=0;i<robot.wheels.length;i++){
    q=robot.wheels[i];
    if(q.motor==="enc") q._odo=(q._odo||0)+(q._ws||0)*dt;
  }

var _rb0=resetBattery;
resetBattery=function(){

  var m=0, i;
  for(i=0;i<robot.parts.length;i++) if(robot.parts[i].type==="ballast") m+=robot.parts[i].mass;

var _am0=applyMotor;

var _fr0=fixedRun;

var _dg0=diagnose;
diagnose=function(){
  var out=[], r=robot, k=world?world.kind:"free", w=r.wheels;
  var slipPct=r.runTime>0.5?100*r.slipTime/r.runTime/Math.max(1,w.length):0;
  var hasG=!!firstPart(r,"gyro"), hasGr=!!gripperPart(r), hasEnc=w.some(function(q){ return q.motor==="enc"; });
  if(k==="hill"){
    if(result&&!result.ok){
      if(slipPct>25) out.push("<b>The wheels spun on the slope for "+slipPct.toFixed(0)+"% of the run.</b> Grip is weight times friction, so put more of the battery over the drive wheels.");
      else out.push("<b>The motors could not lift "+r.mass.toFixed(1)+" kg up the ramp fast enough.</b> Try a gear ratio of 2:1 or 3:1 on the wheels: it trades top speed for pushing force.");
    } else if(result&&result.ok&&runT>25) out.push("<b>It made it, slowly.</b> A 2:1 gear ratio would trade some flat speed for a much quicker climb.");
  } else if(k==="drag"){
    if((polish.maxY||0)>14) out.push("<b>The robot pulled "+(polish.maxY).toFixed(0)+" cm off the centre line.</b> One side of the strip is tile, so those wheels push less than the other side. "+(hasG?"Turn the gain up so the gyro corrects harder.":"A gyro lets Auto hold the heading."));
    if(result&&result.ok&&slipPct>20) out.push("<b>The wheels slipped for "+slipPct.toFixed(0)+"% of the race.</b> A taller gear ratio gets off the line with less wheelspin.");

  } else if(k==="deliver"){
    if(!hasGr) out.push("<b>No gripper fitted.</b> Add one on the front of the chassis so the robot can pick up the cargo.");
    else if(result&&!result.ok&&!(world.payload&&world.payload.held)&&Math.hypot(world.payload.x-world.payload.hx,world.payload.y-world.payload.hy)<2)
      out.push("<b>The cargo never moved.</b> The gripper has to be at the very front, and the robot has to reach the cargo on the line.");
    else if(result&&!result.ok&&world.payload&&world.payload.held) out.push("<b>It is still holding the cargo.</b> Open the gripper over the black drop circle.");
    if(!r.parts.some(function(q){ return q.type==="line"; })) out.push("<b>No line sensors fitted.</b> The path is a painted line.");
  } else if(k==="course"){
    if(slipPct>22) out.push("<b>The wheels slipped for "+slipPct.toFixed(0)+"% of the lap.</b> The tile patch has half the grip of the carpet: slow down there.");
  }

    }

function robotMesh(T,r,accent){

  for(i=0;i<r.parts.length;i++){
    var pp=r.parts[i]; pp._pan=0; pp._lift=0;
    if(pp.type!=="ir"&&pp.type!=="us") continue;
    for(var q=0;q<svs.length;q++){
      if(Math.hypot(svs[q].x-pp.x,svs[q].y-pp.y)<5.5){ pp._pan=svs[q].pos||0; pp._lift=2.2; break; }
    }
  }

  slab(T,0,deckY+th*0.5+0.45,0, r.chassis.w-3.4, 0.9, r.chassis.h-3.4, MAT.deckTop, 3, 5);
  box(T,0,deckY+th*0.5+1.2, r.chassis.h/2-1.6, r.chassis.w-7, 1.2, 2.2, accent||[224,180,40]);
  for(i=0;i<r.parts.length;i++){
    var p=r.parts[i];

      var wx=out*Math.max(Math.abs(p.x), r.chassis.w/2+1.2);
      cylX(T, wx, wr, p.y, wr, 2.4, 16, MAT.tyre, MAT.rim);
      cylX(T, wx, wr, p.y, wr*0.46, 2.7, 12, MAT.rim);
      for(var tb=0;tb<8;tb++){
        var ta=tb/8*TAU;
        box(T, wx, wr+Math.sin(ta)*wr*0.94, p.y+Math.cos(ta)*wr*0.94, 2.6, 0.7, 0.7, [14,15,18]);
      }

      cylX(T, wx-out*(2.0+ml/2), wr, p.y, mw*0.34, 0.5, 10, [150,156,168]);
      if(p.motor==="enc") cylX(T, wx-out*(2.0+ml/2+0.4), wr, p.y, mw*0.42, 0.4, 10, [90,150,220]);
      box(T, (p.x+wx)/2, deckY-0.2, p.y, Math.abs(wx-p.x)+1.6, 1.0, 1.8, MAT.deck);

                    xf(To,Math.cos(b1)*r1,y1,Math.sin(b1)*r1),xf(To,Math.cos(b0)*r1,y1,Math.sin(b0)*r1)],
                   (cs2>3&&cs2<6)?[240,240,244]:[236,110,36]);
        }
      }

    } else if(ob.kind==="ball"){

var drag={ mode:null, x:0, y:0, part:null, id:null, pts:{} , pinch:0 };
function pointerRay(ev){
  var rct=cv.getBoundingClientRect();
  var sx=ev.clientX-rct.left, sy=ev.clientY-rct.top;
  var ndx=(sx-W/2)/VC.f, ndy=-(sy-H/2)/VC.f;
  var dx=VC.fx+VC.rx*ndx+VC.ux*ndy;
  var dy=VC.fy+VC.ry*ndx+VC.uy*ndy;
  var dz=VC.fz+VC.rz*ndx+VC.uz*ndy;
  var L=Math.hypot(dx,dy,dz)||1;
  return { ox:VC.px, oy:VC.py, oz:VC.pz, dx:dx/L, dy:dy/L, dz:dz/L, sx:sx, sy:sy };
}
function rayToDeck(ray,planeY){
  if(Math.abs(ray.dy)<1e-6) return null;
  var t=(planeY-ray.oy)/ray.dy;
  if(t<0) return null;
  return [ray.ox+ray.dx*t, ray.oz+ray.dz*t];
}
function pickObstacle(ev){
  var best=null, bd=30, rct=cv.getBoundingClientRect();
  for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i];
    if(!proj(o.x,o.r,-o.y)) continue;
    var d=Math.hypot(PX-(ev.clientX-rct.left),PY-(ev.clientY-rct.top));
    if(d<bd){ bd=d; best=o; }
  }
  return best;
}
function pickPart(ev){
  var best=null, bd=26;
  for(var i=0;i<build.parts.length;i++){
    var p=build.parts[i], w=xf(IDT,p.x,4,p.y);
    if(!proj(w[0],w[1],w[2])) continue;
    var rct=cv.getBoundingClientRect();
    var d=Math.hypot(PX-(ev.clientX-rct.left),PY-(ev.clientY-rct.top));
    if(d<bd){ bd=d; best=p; }
  }
  return best;
}
cv.addEventListener("pointerdown",function(ev){
  cv.setPointerCapture(ev.pointerId);
  drag.pts[ev.pointerId]={x:ev.clientX,y:ev.clientY};
  if(Object.keys(drag.pts).length===2){
    var a=[]; for(var k in drag.pts) a.push(drag.pts[k]);
    drag.pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); drag.mode="pinch"; return;
  }
  drag.x=ev.clientX; drag.y=ev.clientY;
  var part=view==="build"?pickPart(ev):null;
  var ob=(view==="run"&&!running)?pickObstacle(ev):null;
  if(part){ selected=part; drag.mode="part"; drag.part=part; drawSide(); }
  else if(ob){ drag.mode="obs"; drag.obs=ob; }
  else drag.mode=(ev.shiftKey||ev.button===2)?"pan":"orbit";
});
cv.addEventListener("pointermove",function(ev){
  if(!drag.pts[ev.pointerId]) return;
  var prev=drag.pts[ev.pointerId];
  var dx=ev.clientX-prev.x, dy=ev.clientY-prev.y;
  prev.x=ev.clientX; prev.y=ev.clientY;
  var c=activeCam();
  if(drag.mode==="pinch"){
    var a=[]; for(var k in drag.pts) a.push(drag.pts[k]);
    if(a.length===2){
      var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(drag.pinch>0&&d>0) c.dist=clamp(c.dist*drag.pinch/d, view==="build"?26:70, view==="build"?190:620);
      drag.pinch=d;
    }
    return;
  }
  if(drag.mode==="obs"&&drag.obs){
    var ho=rayToDeck(pointerRay(ev),drag.obs.r*0.5);
    if(ho){
      drag.obs.x=clamp(ho[0],-ARENA.w/2+8,ARENA.w/2-8);
      drag.obs.y=clamp(-ho[1],-ARENA.h/2+8,ARENA.h/2-8);
      drag.obs.hx=drag.obs.x; drag.obs.hy=drag.obs.y;
    }
    return;
  }
  if(drag.mode==="part"&&drag.part){
    var hit=rayToDeck(pointerRay(ev),4);
    if(hit){
      drag.part.x=Math.round(hit[0]*2)/2;
      drag.part.y=Math.round(-hit[1]*2)/2;
      clampPart(drag.part); rebuild();
    }
    return;
  }
  if(drag.mode==="pan"){
    var k2=c.dist*0.0016;
    c.tx-=(VC.rx*dx-VC.ux*dy)*k2;
    c.ty-=(VC.ry*dx-VC.uy*dy)*k2;
    c.tz-=(VC.rz*dx-VC.uz*dy)*k2;
    c.ty=clamp(c.ty,-10,90);
  } else {
    c.yaw-=dx*0.007;
    c.pitch=clamp(c.pitch+dy*0.005,0.12,1.45);
  }
});
function endPtr(ev){

  for(i=0;i<obs.length;i++) obs[i].addEventListener("click", function(){
    var kind=this.getAttribute("data-obs");
    var a=obstacles.length*1.1;
    var nx0=Math.cos(a)*34+10, ny0=Math.sin(a)*26-6;
    obstacles.push({ kind:kind, x:nx0, y:ny0, hx:nx0, hy:ny0, r:kind==="ball"?6:(kind==="crate"?7:5.5) });
    if(world) world.obstacles=obstacles;
    drawSide();
  });
  if(el("obsClear")) el("obsClear").addEventListener("click", function(){ obstacles.length=0; drawSide(); });
  if(el("pDel")) el("pDel").addEventListener("click", function(){
    var k=build.parts.indexOf(selected); if(k>=0) build.parts.splice(k,1); selected=null; rebuild();
  });
  if(el("bStarter")) el("bStarter").addEventListener("click", starterBuild);
  if(el("bClear")) el("bClear").addEventListener("click", function(){ build.parts=[]; selected=null; rebuild(); });
  if(el("addRule")) el("addRule").addEventListener("click", function(){
    rules.splice(Math.max(0,rules.length-1),0,{cond:"lineAny",op:">",val:0.4,act:"forward"}); drawRules();
  });
  var behs=side.querySelectorAll("[data-beh]");
  for(i=0;i<behs.length;i++) behs[i].addEventListener("click", function(){ tuneBehaviour=this.getAttribute("data-beh"); drawSide(); });
  var ss=side.querySelectorAll("[data-slotsave]");
  for(i=0;i<ss.length;i++) ss[i].addEventListener("click", function(){ saveSlot(+this.getAttribute("data-slotsave")); });
  var sl=side.querySelectorAll("[data-slotload]");
  for(i=0;i<sl.length;i++) sl[i].addEventListener("click", function(){ loadSlot(+this.getAttribute("data-slotload")); });
  if(el("bShare")) el("bShare").addEventListener("click", function(){
    openSheet("copy","Build code","Copy this code to keep or share the build. Paste it back with Paste build code.",exportBuild(),"bench-build.json"); });
  if(el("bPaste")) el("bPaste").addEventListener("click", function(){
    openSheet("paste","Paste build code","Paste code that was copied from Bench. Your current build will be replaced.","",null); });
  if(el("bCsv")) el("bCsv").addEventListener("click", exportCsv);
  if(el("lsHint")) el("lsHint").addEventListener("click", function(){ hintOpen=!hintOpen; drawSide(); });
  if(el("lsRun")) el("lsRun").addEventListener("click", function(){ setView("run"); });
  if(el("lsNext")) el("lsNext").addEventListener("click", nextLesson);
  if(el("lsKeep")) el("lsKeep").addEventListener("click", function(){ leaveLesson(false); });
  if(el("lsRestore")) el("lsRestore").addEventListener("click", function(){ leaveLesson(true); });
}

addEventListener("keydown", function(e){
  var t=e.target&&e.target.tagName;
  if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA") return;
  keys[e.key.toLowerCase()]=true;
  if(["w","a","s","d"].indexOf(e.key.toLowerCase())>=0||e.key.indexOf("Arrow")===0) e.preventDefault();
});
addEventListener("keyup", function(e){ keys[e.key.toLowerCase()]=false; });
addEventListener("blur", function(){ for(var kk in keys) keys[kk]=false; });

function setView(v){
  view=v;
  el("tabBuild").setAttribute("aria-selected", String(v==="build"));
  el("tabRun").setAttribute("aria-selected", String(v==="run"));
  if(v==="run"&&!world){ world=makeWorld(el("challenge").value); buildMask(); robot.reset(world.start.x,world.start.y,world.start.th); }
  drawSide();
}
el("tabBuild").addEventListener("click", function(){ if(running) stopRun(); setView("build"); });
el("tabRun").addEventListener("click", function(){ setView("run"); });
el("challenge").addEventListener("change", function(){
  if(running) stopRun();
  clearRun();
  autoConfigure(this.value);
  world=makeWorld(this.value); buildMask();
  robot.reset(world.start.x,world.start.y,world.start.th);
  trail=[]; el("report").hidden=true; setStatus("Ready");
  if(view==="run") drawSide();
});
el("btnRun").addEventListener("click", function(){ if(running){ stopRun(); } else startRun(); });
el("btnReset").addEventListener("click", function(){
  if(running) stopRun();
  clearRun();
  world=makeWorld(el("challenge").value); buildMask();
  robot.reset(world.start.x,world.start.y,world.start.th);
  trail=[]; el("report").hidden=true; setStatus("Ready"); el("telemetry").textContent="";
});
el("reportClose").addEventListener("click", function(){ el("report").hidden=true; });
function setMode(m){ mode=m; drawSide(); }

addEventListener("resize", function(){ resize(); frameScene(); });

var last=performance.now();
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(!(dt>0)) dt=0; else if(dt>0.05) dt=0.05;
  tick(dt);
  stepReplay(dt);
  if(view==="build") drawBuild(); else drawRun();
  drawGraphs();
  updateToggles();
  layoutPass();
  polishFrame(dt);
  requestAnimationFrame(frame);
}
wireOverlays();
loadProgress();
newInit();
loadBests();
wireExtras();
wireLayout();
wireClass();
polishInit();
histInit();
resize();
frameScene();
starterBuild();
autoConfigure("line");
setMode("tune");
setView("build");
histReset();
drawSide();
requestAnimationFrame(frame);

if(TEST){
  window.__bench={
    build:build, addPart:addPart, rebuild:rebuild, starterBuild:starterBuild,
    get robot(){ return robot; }, get world(){ return world; }, get running(){ return running; },
    get result(){ return result; }, diagnose:diagnose, setMode:setMode, setView:setView,
    startRun:startRun, stopRun:stopRun, tick:tick, keys:keys, batt:batt, applyMotor:applyMotor, MOTORS:MOTORS, obstacles:obstacles, readSensors:function(){ return readSensors(robot); },
    rules:rules, tune:tune, setBehaviour:function(b){ tuneBehaviour=b; drawSide(); },
    state:function(){ return { view:view, mode:mode, running:running, t:runT,
      x:robot.x, y:robot.y, th:robot.th, mass:robot.mass, stability:robot.stability(),
      wheels:robot.wheels.length, parts:build.parts.length,
      result:result, trail:trail.length }; },
    exportBuild:exportBuild, importBuild:importBuild, csvText:csvText, saveText:saveText, startLesson:startLesson,
    LESSONS:LESSONS, lessonDone:lessonDone, get lesson(){ return lesson; }, get rec(){ return rec; },
    get bests(){ return bests; }, get lastRun(){ return lastRun; }, get rp(){ return rp; }, get curT(){ return curT; },
    get ghostOn(){ return ghostOn; }, set ghostOn(v){ ghostOn=v; }, ghostTrace:ghostTrace, ghostEntry:ghostEntry, ghostPick:ghostPick,
    startReplay:startReplay, stepReplay:stepReplay, closeReplay:closeReplay, loadBests:loadBests, saveBests:saveBests,
    packTrace:packTrace, unpackTrace:unpackTrace, poseAt:poseAt, openRecords:openRecords, drawGraphs:drawGraphs, gapInfo:gapInfo,
    get assign(){ return assign; }, get assignId(){ return assignId; }, get assignOfficial(){ return assignOfficial; }, get cls(){ return cls; },
    parseAssignment:parseAssignment, applyAssignment:applyAssignment, leaveAssignment:leaveAssignment, assignChecks:assignChecks,
    officialRun:officialRun, fixedRun:fixedRun, verifyAll:verifyAll, parseSubs:parseSubs, resultsCsv:resultsCsv, hash5:hash5, openClass:openClass,
    openSheet:openSheet, setRules:setRules, tuneState:function(){ return { mode:mode, beh:tuneBehaviour }; },
    setChallenge:function(c){ el("challenge").value=c; el("challenge").dispatchEvent(new Event("change")); }
  };
  Object.assign(window.__bench,benchExtra());
}
})();
</script>
</body>
</html>
